# @file docker-compose.env_workers.yml
# @brief Parameterised single-worker template: one CARLA server + one ros2-bridge.
#
# Each worker is one CARLA instance (world + streaming + RPC ports) paired with
# a ros2-bridge that writes covariance to a per-worker EKF state file.
#
# Bring up N workers by running this file N times with different WORKER_RANK values.
# The Makefile handles this automatically -- never call docker compose directly.
#
# Environment variables (set by Makefile, all have safe defaults for rank 0):
#   WORKER_RANK     Worker index (0, 1, 2 ...). Default: 0.
#   CARLA_PORT      Base port for this worker (2000, 3000, 4000 ...). Default: 2000.
#   CARLA_PORT_END  CARLA_PORT + 2. Default: 2002. (Required for port range mapping.)
#   ROS_DOMAIN_ID   DDS domain (42, 43, 44 ...). Default: 42.
#   EKF_STATE_FILE  Per-worker EKF state file path. Default: ekf_state.json.
#   CARTOGRAPHER_MODE  slam or loc. Default: slam.
#   CARTOGRAPHER_MAP   Path to .pbstream (required when MODE=loc). Default: empty.
#   SENSOR_SUITE    suite_a, suite_b, or suite_c. Default: suite_a.
#
# Port stride 1000: avoids collision with CARLA's 3-port block (world, streaming, RPC).
#   Worker 0: ports 2000-2002, domain 42, ekf_state.json
#   Worker 1: ports 3000-3002, domain 43, ekf_state_1.json
#   Worker 2: ports 4000-4002, domain 44, ekf_state_2.json
#
# Hardware ceiling (RTX 4070 Ti Super): 2 workers.
#   RAM: ~4 GB per CARLA instance, 7 GB free at idle -> 2 workers safe.
#   GPU: 1% util, 19% VRAM -- not the bottleneck.
#   Expected throughput: ~40-50 it/s (2 workers) vs ~20-25 it/s (1 worker).
#
# @author Antonio Galdes

name: ucrl

services:
  # CARLA simulation server for this worker -- headless, GPU passthrough
  carla-server:
    image: carlasim/carla:0.9.16
    container_name: uncertainty-rl-carla-${WORKER_RANK:-0}
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    # Headless mode: -RenderOffScreen eliminates display dependency.
    command: >
      /bin/bash CarlaUE4.sh
      -RenderOffScreen
      -world-port=${CARLA_PORT:-2000}
      -resx=800
      -resy=600
      -quality-level=Low
    ports:
      # Port range: CARLA_PORT to CARLA_PORT+2 (world, streaming, RPC).
      - "${CARLA_PORT:-2000}-${CARLA_PORT_END:-2002}:${CARLA_PORT:-2000}-${CARLA_PORT_END:-2002}"
    networks:
      - uncertainty-rl-network
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Host Vulkan ICD so CARLA can find the NVIDIA Vulkan driver inside the container.
      - /usr/share/vulkan/icd.d:/usr/share/vulkan/icd.d:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/${CARLA_PORT:-2000}' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ROS 2 Jazzy bridge for this worker -- writes ekf_state to per-worker path
  ros2-bridge:
    build:
      context: .
      dockerfile: uncertainty_rl/ros2/Dockerfile
      args:
        ROS_DISTRO: jazzy
    container_name: uncertainty-rl-ros2-${WORKER_RANK:-0}
    restart: on-failure
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      # Separate DDS domain per worker to prevent cross-worker topic crosstalk.
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-42}
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CARLA_HOST=carla-server
      - CARLA_PORT=${CARLA_PORT:-2000}
      # Cartographer + sensor settings -- inherited from Makefile LOC_ENV.
      - SENSOR_SUITE=${SENSOR_SUITE:-suite_a}
      - CARTOGRAPHER_MODE=${CARTOGRAPHER_MODE:-slam}
      - CARTOGRAPHER_MAP=${CARTOGRAPHER_MAP:-}
      # Per-worker EKF state file read by covariance_extractor.py via
      # the ekf_state_file ROS 2 parameter declared in __init__.
      - EKF_STATE_FILE=${EKF_STATE_FILE:-/workspace/outputs/ekf_state.json}
    depends_on:
      carla-server:
        condition: service_healthy
    networks:
      - uncertainty-rl-network
    volumes:
      - ./configs:/workspace/configs:ro
      # configs/maps is rw so make docker-map can write .pbstream files into it.
      - ./configs/maps:/workspace/configs/maps:rw
      - ./logs/ros2:/workspace/logs:rw
      - ./outputs:/workspace/outputs:rw
      - ./uncertainty_rl/ros2:/workspace/src/uncertainty_rl_ros2:ro
    command: >
      bash -c "
        source /opt/ros/jazzy/setup.bash &&
        source /workspace/install/setup.bash &&
        ros2 launch uncertainty_rl_ros2 carla_bridge.launch.py
      "
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'ros2 launch' > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

networks:
  uncertainty-rl-network:
    # External: must already exist (created by docker-compose.yml or docker network create).
    external: true
    name: uncertainty-rl-network
