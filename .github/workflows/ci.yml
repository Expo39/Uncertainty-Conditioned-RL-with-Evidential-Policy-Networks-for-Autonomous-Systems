name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

# Cancel in-progress runs for the same branch/PR to save Actions minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pip install autoflake

      - name: Remove unused imports (autoflake)
        run: autoflake --in-place --remove-all-unused-imports --recursive uncertainty_rl tests scripts

      - name: Sort imports (isort)
        run: isort uncertainty_rl tests scripts

      - name: Format code (black)
        run: black uncertainty_rl tests scripts

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Apply auto-formatting fixes

      - name: Run flake8
        run: flake8 uncertainty_rl tests scripts --max-line-length 88 --extend-ignore E203,W503

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps: 
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests (no CARLA/ROS 2 required)
        run: pytest tests/ -v --tb=short -m "not integration"

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run mypy
        run: mypy uncertainty_rl --ignore-missing-imports
