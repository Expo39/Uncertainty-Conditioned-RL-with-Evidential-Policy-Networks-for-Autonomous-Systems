name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

# Cancel in-progress runs for the same branch/PR to save Actions minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Mirrors `make verify`, except that autoflake/isort/black run in FIX mode here
# and auto-commit, whereas the local target only checks. No unit tests: torch and
# sb3 are too heavy for CI, so those run via `make docker-test-unit`.

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pip install autoflake

      - name: Remove unused imports (autoflake)
        run: autoflake --in-place --remove-all-unused-imports --recursive uncertainty_rl tests scripts

      - name: Sort imports (isort)
        run: isort uncertainty_rl tests scripts

      - name: Format code (black)
        run: black uncertainty_rl tests scripts

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Apply auto-formatting fixes

      - name: Run flake8
        run: flake8 uncertainty_rl tests scripts

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run mypy
        run: mypy uncertainty_rl --ignore-missing-imports

  sanity:
    name: Sanity Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install package
        run: |
          pip install --upgrade pip
          pip install -e "."

      - name: Check package imports
        run: python -c "import uncertainty_rl; print('Package imports OK')"
