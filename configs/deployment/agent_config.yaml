# Agent configuration shared between simulation and real-vehicle deployment.
#
# This file contains all non-sensor parameters that are identical in CARLA
# simulation and on the real vehicle. It is the single source of truth for
# agent behaviour, observation flags, ROS 2 pipeline settings, safety policy
# parameters, and deployment flags.

# ---------------------------------------------------------------------------
# Policy safety parameters
# ---------------------------------------------------------------------------
max_ego_speed_ms: 8.0  # Speed limit (m/s).

# ---------------------------------------------------------------------------
# Actuator model
#
# Rate limits and a brake-overrides-throttle constraint applied to the policy
# action before it is forwarded to CARLA or the real vehicle. Units are
# normalised action units per policy decision (0.2 s with action_repeat=4 and
# carla_timestep=0.05). See docs/detailed_notes/actuator_model.md.
# ---------------------------------------------------------------------------
actuator_model:
  steer_max_delta_per_decision: 0.15  # Steer rate limit. ~50 deg/s at the road wheel (CARLA max_steer_angle=70 deg).
  throttle_max_delta_per_decision: 0.5  # Throttle rate limit. 0 -> full in 0.4 s. Matches drive-by-wire response.
  brake_max_delta_per_decision: 0.5  # Brake rate limit. 0 -> full in 0.4 s. Matches hydraulic pressure rise.
  brake_override_throttle_threshold: 0.3  # Throttle is zeroed whenever brake exceeds this fraction. Raised from 0.1 to 0.3 so soft-brake samples (common while the policy is uncertain) do not silently cut throttle and corrupt the late-stage credit assignment between the two axes.

# SafetyWrapper parameters.
# aleatoric_scaling: higher = more aggressive longitudinal cap under outcome noise.
# handoff_threshold: epistemic uncertainty above this triggers full stop + handoff.
safety_aleatoric_scaling: 0.5
safety_handoff_threshold: 5.0

# ---------------------------------------------------------------------------
# Observation space flags (must match the trained policy)
# ---------------------------------------------------------------------------
include_covariance: true  # Include EKF covariance features
include_obstacle_obs: true  # Include 5 hemispheric LiDAR clearance dims

# ---------------------------------------------------------------------------
# ROS 2 / EKF pipeline settings
# ---------------------------------------------------------------------------
ros2:
  covariance_topic: "/odometry/filtered"  # Topic where EKF publishes covariance. 
  covariance_timeout: 120.0  # Seconds to wait for covariance messages.
  ekf_convergence_timeout: 15.0  # Seconds to wait for EKF convergence.
  publish_initial_pose: true  # Publishes /set_pose at each episode reset.
  initial_pose_topic: "/set_pose"

# ---------------------------------------------------------------------------
# Real-world deployment flags
# ---------------------------------------------------------------------------
real_world_deployment: false  # Set true to activate datum-based EKF calibration
                              # and actuation calibration on the real vehicle.
real_world_datum: configs/deployment/real/real_world_datum.yaml
actuation_calibration: configs/deployment/real/actuation_calibration.yaml
