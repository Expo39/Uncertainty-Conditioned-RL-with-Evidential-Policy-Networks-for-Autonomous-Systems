# Agent configuration shared between simulation and real-vehicle deployment.
#
# This file contains all non-sensor parameters that are identical in CARLA
# simulation and on the real vehicle. It is the single source of truth for
# agent behaviour, observation flags, ROS 2 pipeline settings, safety policy
# parameters, and deployment flags.

# ---------------------------------------------------------------------------
# Policy safety parameters
# ---------------------------------------------------------------------------
# Hard speed governor (throttle is cut at or above this speed, brake unaffected).
# Sized for the manoeuvre, not the road: at the 5 Hz decision rate with the
# steering slew below, the turn-in window must span several policy decisions -
# 3.5 m/s gives ~0.7 m per decision and a ~2.5 m steering ramp, versus 1.6 m and
# 8 m at 8 m/s, where the corridor turn passes in 1-2 decisions.
max_ego_speed_ms: 3.5  # Speed limit (m/s).

# ---------------------------------------------------------------------------
# Actuator model
#
# Rate limits and a brake-overrides-throttle constraint applied to the policy
# action before it reaches CARLA or the real vehicle. Units are normalised
# action units per policy decision (0.2 s at action_repeat=4, carla_timestep=0.05).
# ---------------------------------------------------------------------------
actuator_model:
  steer_max_delta_per_decision: 0.20  # Steer rate limit (~70 deg/s at the road wheel).
  throttle_max_delta_per_decision: 0.5  # Throttle rate limit (0 -> full in 0.4 s).
  brake_max_delta_per_decision: 0.5  # Brake rate limit (0 -> full in 0.4 s).
  brake_override_throttle_threshold: 0.3  # Throttle is zeroed when brake exceeds this fraction.

# SafetyWrapper parameters: aleatoric_scaling caps longitudinal speed under outcome
# noise; handoff_threshold is the epistemic level that triggers a stop + handoff.
safety_aleatoric_scaling: 0.5
safety_handoff_threshold: 5.0

# ---------------------------------------------------------------------------
# Deployed baseline (real vehicle)
#
# Names the baseline the deployed checkpoint was trained as; its obs flags and
# policy_type are read from that file.
# ---------------------------------------------------------------------------
baseline: configs/baselines/full_method.yaml

# ---------------------------------------------------------------------------
# ROS 2 / EKF pipeline settings
# ---------------------------------------------------------------------------
ros2:
  covariance_topic: "/odometry/filtered"  # Topic where EKF publishes covariance. 
  covariance_timeout: 120.0  # Seconds to wait for covariance messages.
  ekf_convergence_timeout: 15.0  # Seconds to wait for EKF convergence.
  publish_initial_pose: true  # Publishes /set_pose at each episode reset.

# ---------------------------------------------------------------------------
# Real-world deployment paths
# ---------------------------------------------------------------------------
real_world_datum: configs/deployment/real/real_world_datum.yaml
actuation_calibration: configs/deployment/real/actuation_calibration.yaml
