# RTK-GNSS noise profiles for per-episode fix-state sampling.
# Consumed by GnssNoiseRelayNode. Tier is sampled each reset(); noise injected
# into NavSatFix.position_covariance so the EKF receives correctly scaled
# measurement noise. doppler_stddev_ms (velocity + COG heading noise) scales by
# the same per-tier factor as metric_stddev_m (1 / 18 / 90 / 250x of the
# rtk_fixed base), so velocity and heading degrade with the fix state. Mirror
# these values in _TIER_DEFAULTS in gnss_noise_relay.py.

tiers:
  rtk_fixed:
    # RTK fixed-integer solution: cm-level accuracy.
    # Parking is easy; policy learns nominal manoeuvring.
    lat_stddev_deg: 0.0000002
    lon_stddev_deg: 0.0000002
    alt_stddev_m: 0.05
    metric_stddev_m: 0.020
    doppler_stddev_ms: 0.05  # m/s - 1x base (ZED-F9P data-sheet accuracy)
    weight: 0.40  # Per-episode START-tier probability, biased toward bad tiers (not
    # the stationary occupancy) so most episodes begin under uncertainty; the chain
    # still recovers mid-episode. @see curriculum_design_principles.md.
    description: "RTK fixed (~2 cm). Nominal parking conditions."

  rtk_float:
    # RTK float solution: decimetre-level accuracy.
    # Parking is tight; uncertainty penalty starts biting.
    lat_stddev_deg: 0.0000032  # 0.360 m 1-sigma
    lon_stddev_deg: 0.0000032
    alt_stddev_m: 0.5
    metric_stddev_m: 0.360
    doppler_stddev_ms: 0.90  # m/s - 18x base (matches position factor)
    weight: 0.20  # Biased START-tier probability (see rtk_fixed for the rationale).
    description: "RTK float (~36 cm). Marginal accuracy for 2.5 m bays."

  standalone:
    # Standalone GNSS (RTK lost): metre-level accuracy.
    # Progress reward nearly zero; policy learns to wait.
    lat_stddev_deg: 0.0000162  # 1.802 m 1-sigma
    lon_stddev_deg: 0.0000162
    alt_stddev_m: 5.0
    metric_stddev_m: 1.802
    doppler_stddev_ms: 4.5  # m/s - 90x base (matches position factor)
    weight: 0.20  # Biased START-tier probability (see rtk_fixed).
    description: "Standalone GNSS (~1.8 m). RTK lost; parking unsafe."

  degraded:
    # Progress reward saturates to zero; policy learns hard abort.
    lat_stddev_deg: 0.0000449  # 5.0 m 1-sigma
    lon_stddev_deg: 0.0000449
    alt_stddev_m: 10.0
    metric_stddev_m: 5.0
    doppler_stddev_ms: 12.5  # m/s - 250x base (matches position factor)
    weight: 0.20  # Biased START-tier probability (see rtk_fixed).
    description: "Degraded GNSS (~5 m). Policy must abort/handoff."

# Per-step transitions at the 20 Hz callback rate; rows = from-tier, columns =
# to-tier in key order. Ladder-only, so a walk never skips a rung. Recovery beats
# degradation everywhere off-fixed, making the chain fixed-dominant (~80%), and
# every dwell stays under the ~10 s stall margin so a wait is never cut short.
transition_matrix:
  rtk_fixed:  [0.9920, 0.0080, 0.0000, 0.0000]   # leave fix ~0.8%/step (excursion onset)
  rtk_float:  [0.0400, 0.9550, 0.0050, 0.0000]   # recover 0.040 >> degrade 0.005
  standalone: [0.0000, 0.0080, 0.9875, 0.0045]   # recover 0.0080 > degrade 0.0045 (dwell ~4s)
  degraded:   [0.0000, 0.0000, 0.0071, 0.9929]   # climb back out 0.0071 (dwell ~7s)
