# Curriculum Stage 6 - full clean Phase A (the published training condition).
# Resume from Stage 5. Full occupancy (0.2-0.8) and the strict margin. Phase B
# (sensor noise) turns on in Stage 7.

use_extra_spawns: true
bay_margin: -0.25  # Strict published criterion.

parking_scenarios:
  fixed_floor_plan: rectangle
  fixed_gnss_tier: rtk_fixed
  bay_occupancy_min: 0.2  # Full occupancy range.
  bay_occupancy_max: 0.8

carla_sensors:
  lidar:
    noise:
      enabled: false  # Phase A: clean sensors.

training_overrides:
  stage_timesteps: 2000000
  learning_rate: 0.0002
  learning_rate_final: 0.00003
  # Near the shared 0.0005 floor (resumed stage - see stage 2/3). Density only (no new
  # geometry), so the smallest nudge.
  ent_coef: 0.0008
  ent_coef_final: 0.0005
