# Curriculum Stage 6 - margin to strict (still clean). Resume from Stage 5.
# Primary axis: bay_margin tightens to the strict criterion (-0.25), held hereafter.

use_extra_spawns: false
bay_margin: -0.25  # Strict criterion (STRICT_BAY_MARGIN), held hereafter.

parking_scenarios:
  fixed_floor_plan: rectangle
  fixed_gnss_tier: rtk_fixed  # Per-episode start tier.
  bay_occupancy_min: 0.1
  bay_occupancy_max: 0.1

carla_sensors:
  lidar:
    noise:
      enabled: true  # Constant realism floor (on in every stage).

# Identical standard/evidential blocks - see Stage 1.
standard_overrides:
  stage_timesteps: 1500000
  learning_rate: 0.0002
  learning_rate_final: 0.00004
  ent_coef: 0.001
  ent_coef_final: 0.0005
evidential_overrides:
  stage_timesteps: 1500000
  learning_rate: 0.0002
  learning_rate_final: 0.00004
  ent_coef: 0.001
  ent_coef_final: 0.0005
