# Curriculum Stage 6 - occupancy to its busiest (final operating point). Resume from
# Stage 5. Primary axis: bay occupancy (max 0.8). The GNSS degradation process is fixed
# across all stages (see configs/deployment/sim/gnss_noise_profiles.yaml), not a
# curriculum axis.

use_extra_spawns: false
bay_margin: -0.25  # Strict, held.

parking_scenarios:
  fixed_floor_plan: rectangle
  # fixed_gnss_tier omitted: start tier is SAMPLED from the init weights in
  # gnss_noise_profiles.yaml (any fix state), then wanders via the Markov chain.
  bay_occupancy_min: 0.0  # Empty in-distribution (see stage1); max 0.8 keeps the
  # busiest occupied case so LiDAR collision-avoidance is still learned.
  bay_occupancy_max: 0.8

carla_sensors:
  lidar:
    noise:
      enabled: true  # Constant realism floor (on in every stage).

# Identical standard/evidential blocks - see Stage 1.
standard_overrides:
  stage_timesteps: 1500000
  learning_rate: 0.0001
  learning_rate_final: 0.00002
  ent_coef: 0.001
  ent_coef_final: 0.0005
evidential_overrides:
  stage_timesteps: 1500000
  learning_rate: 0.0001
  learning_rate_final: 0.00002
  # Higher start + floor than the standard block: action std = sqrt(aleatoric),
  # so a collapsing head kills exploration (the standard log_std is decoupled).
  ent_coef: 0.002
  ent_coef_final: 0.0015
