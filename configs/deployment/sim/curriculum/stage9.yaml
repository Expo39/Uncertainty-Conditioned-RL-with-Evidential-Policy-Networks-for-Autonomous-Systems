# Curriculum Stage 9 - occupancy to its busiest. Resume from Stage 8.
# Primary axis: bay occupancy (max 0.8). The GNSS degradation process is fixed across
# all stages (see configs/deployment/sim/gnss_noise_profiles.yaml), not a curriculum axis.

use_extra_spawns: false
bay_margin: -0.25  # Strict, held.

parking_scenarios:
  fixed_floor_plan: rectangle
  fixed_gnss_tier: rtk_fixed  # Per-episode start tier.
  bay_occupancy_min: 0.2
  bay_occupancy_max: 0.8

carla_sensors:
  lidar:
    noise:
      enabled: true  # Constant realism floor (on in every stage).

# Identical standard/evidential blocks - see Stage 1.
standard_overrides:
  stage_timesteps: 2500000
  learning_rate: 0.00015
  learning_rate_final: 0.00002
  ent_coef: 0.001
  ent_coef_final: 0.0005
evidential_overrides:
  stage_timesteps: 2500000
  learning_rate: 0.00015
  learning_rate_final: 0.00002
  ent_coef: 0.001
  ent_coef_final: 0.0005
