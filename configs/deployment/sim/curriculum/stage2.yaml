# Curriculum Stage 2 - bay count up (~2 per cluster). Resume from Stage 1.
# Primary axis: bay variety.

use_extra_spawns: false
bay_margin: -0.65

parking_scenarios:
  fixed_floor_plan: rectangle
  fixed_gnss_tier: rtk_fixed
  allowed_bay_ids:  # Two per cluster, all 4 orientations.
    - perpendicular_3
    - perpendicular_8     # yaw 270, north row
    - perpendicular_23
    - perpendicular_29    # yaw 270, upper row
    - perpendicular_14
    - perpendicular_17    # yaw 90, south row
    - perpendicular_35
    - perpendicular_38    # yaw 0, west column
    - perpendicular_41
    - perpendicular_43    # yaw 180, east column
  bay_occupancy_min: 0.1
  bay_occupancy_max: 0.1

carla_sensors:
  lidar:
    noise:
      enabled: true  # Constant realism floor (on in every stage).

# Identical standard/evidential blocks - see Stage 1.
standard_overrides:
  stage_timesteps: 1500000
  learning_rate: 0.00025
  learning_rate_final: 0.00005
  ent_coef: 0.0015
  ent_coef_final: 0.0005
evidential_overrides:
  stage_timesteps: 1500000
  learning_rate: 0.00025
  learning_rate_final: 0.00005
  ent_coef: 0.0015
  ent_coef_final: 0.0005
