# Curriculum Stage 2 - bay variety on one row, single orientation.
# Resume from Stage 1. Target bay random but restricted to the north row
# (perpendicular_0..11, all yaw 270); spawn still locked. One new axis vs Stage 1.

use_extra_spawns: false  # Still locked to the primary spawn - only the bay varies.
bay_margin: -0.65  # Looser while bay variety lands.

parking_scenarios:
  fixed_floor_plan: rectangle
  fixed_gnss_tier: rtk_fixed
  allowed_bay_ids:  # Random target restricted to the north row (one orientation).
    - perpendicular_0
    - perpendicular_1
    - perpendicular_2
    - perpendicular_3
    - perpendicular_4
    - perpendicular_5
    - perpendicular_6
    - perpendicular_7
    - perpendicular_8
    - perpendicular_9
    - perpendicular_10
    - perpendicular_11
  bay_occupancy_min: 0.0  # Still no parked cars.
  bay_occupancy_max: 0.0

carla_sensors:
  lidar:
    noise:
      enabled: false  # Phase A: clean sensors.

training_overrides:
  stage_timesteps: 2000000
  learning_rate: 0.0003
  learning_rate_final: 0.00005
  # ent_coef sized against the NORMALISED reward (progress sums to +1 per episode,
  # ~0.01 reward/decision). The entropy bonus ent_coef*H is reward-scale-independent,
  # so the old 0.018 (chosen against the un-normalised reward) now dwarfs the
  # per-decision progress gradient by 3-8x and drives entropy runaway (std climbs,
  # success stays 0). 0.006 keeps the entropy bonus near parity with the reward
  # gradient at the operating std (~0.5) - a genuine exploration nudge, not a
  # dominating term. @see CURRICULUM_PLAN: later stages likely need similar cuts.
  ent_coef: 0.006
  ent_coef_final: 0.004
