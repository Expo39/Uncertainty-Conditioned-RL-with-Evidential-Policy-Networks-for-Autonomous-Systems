# Curriculum Stage 7 - obstacles begin. Resume from Stage 6.
# Primary axis: bay occupancy (the avoidance task); geometry and margin frozen.

use_extra_spawns: false
bay_margin: -0.25  # Strict, held.

parking_scenarios:
  fixed_floor_plan: rectangle
  fixed_gnss_tier: rtk_fixed  # Per-episode start tier.
  bay_occupancy_min: 0.2
  bay_occupancy_max: 0.4

carla_sensors:
  lidar:
    noise:
      enabled: true  # Constant realism floor (on in every stage).

# Identical standard/evidential blocks - see Stage 1.
standard_overrides:
  stage_timesteps: 2000000
  learning_rate: 0.0002
  learning_rate_final: 0.00003
  ent_coef: 0.001
  ent_coef_final: 0.0005
evidential_overrides:
  stage_timesteps: 2000000
  learning_rate: 0.0002
  learning_rate_final: 0.00003
  ent_coef: 0.001
  ent_coef_final: 0.0005
