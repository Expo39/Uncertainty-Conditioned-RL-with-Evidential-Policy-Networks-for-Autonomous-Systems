# Curriculum Stage 3 - all bays, all orientations, from the SAME spawn
#
# Resume from Stage 2's final checkpoint. Stage 2 parks any bay in the north row
# (single yaw 270) from the fixed primary spawn; now the target is ANY of the 47
# eligible bays, spread across the lot at all 4 approach orientations (270/90/0/
# 180), but the spawn is STILL locked to the primary point. This adds the
# across-orientations axis on its own. Spawn variety arrives in Stage 4; parked
# cars in Stage 5.
#
# This is the single biggest generalisation jump in the clean phase (one row ->
# the whole lot, 12 -> 47 bays at 4 orientations), so it gets the longest clean
# budget to consolidate "park ANY bay" before spawn variety is added.

use_extra_spawns: false  # STILL locked to the primary spawn - only the bay varies.

parking_scenarios:
  fixed_floor_plan: rectangle
  # allowed_bay_ids removed -> every eligible bay is a target (all orientations).
  fixed_gnss_tier: rtk_fixed
  bay_occupancy_min: 0.0  # Still no parked cars.
  bay_occupancy_max: 0.0
  num_patrol_vehicles_max: 0
  pedestrian_spawn_probability: 0.0

bay_margin: -0.6  # Tighter than Stage 2; still loose while orientation variety lands.

training_overrides:
  stage_timesteps: 3000000
  learning_rate: 0.0003
  learning_rate_final: 0.00005
  ent_coef: 0.015
  ent_coef_final: 0.006
