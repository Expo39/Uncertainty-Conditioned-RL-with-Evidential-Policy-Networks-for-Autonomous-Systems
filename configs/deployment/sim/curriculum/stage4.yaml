# Curriculum Stage 4 - margin to strict (still clean). Resume from Stage 3.
# Primary axis: bay_margin tightens to the strict criterion (-0.25), held hereafter.

use_extra_spawns: false
bay_margin: -0.25  # Strict criterion (STRICT_BAY_MARGIN), held hereafter.

parking_scenarios:
  fixed_floor_plan: rectangle
  # fixed_gnss_tier omitted: start tier is SAMPLED from the init weights in
  # gnss_noise_profiles.yaml (any fix state), then wanders via the Markov chain.
  bay_occupancy_min: 0.0  # Empty in-distribution (see stage1).
  bay_occupancy_max: 0.1

carla_sensors:
  lidar:
    noise:
      enabled: true  # Constant realism floor (on in every stage).

# Identical standard/evidential blocks - see Stage 1.
standard_overrides:
  stage_timesteps: 1500000
  learning_rate: 0.00012
  learning_rate_final: 0.00004
  ent_coef: 0.001
  ent_coef_final: 0.0005
evidential_overrides:
  stage_timesteps: 1500000
  learning_rate: 0.00012
  learning_rate_final: 0.00004
  # Higher start + floor than the standard block: the action std is an actor
  # output (sqrt(aleatoric), or exp(log_std) for the heteroscedastic head), so a
  # collapsing head kills exploration (the standard log_std is decoupled).
  ent_coef: 0.002
  ent_coef_final: 0.0015
