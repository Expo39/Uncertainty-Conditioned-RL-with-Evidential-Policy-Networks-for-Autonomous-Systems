# Curriculum Stage 4 - introduce parked cars (the avoidance task)
#
# Resume from Stage 3's final checkpoint. The policy parks any bay from any spawn
# in clean conditions; now non-target bays start filling with parked cars, so the
# obstacle-clearance behaviour (Gap B reward term) finally has episodes that reach
# the bay to learn avoidance from. Occupancy starts light (0.2-0.4) and the margin
# tightens toward the strict criterion. Density rises in Stage 5.

use_extra_spawns: true

parking_scenarios:
  fixed_floor_plan: rectangle
  fixed_gnss_tier: rtk_fixed
  bay_occupancy_min: 0.2  # Light occupancy - some neighbours, not a packed lot.
  bay_occupancy_max: 0.4
  num_patrol_vehicles_max: 0
  pedestrian_spawn_probability: 0.0

bay_margin: -0.4  # Approaching the strict criterion.

training_overrides:
  stage_timesteps: 2000000
  learning_rate: 0.00025
  learning_rate_final: 0.00005
  ent_coef: 0.012
  ent_coef_final: 0.005
