# Curriculum Stage 4 - add spawn variety (still no parked cars).
# Resume from Stage 3. Spawn is now random (primary + extras).

use_extra_spawns: true  # Random spawn each episode (primary + extras).
bay_margin: -0.5  # Looser while spawn variety lands.

parking_scenarios:
  fixed_floor_plan: rectangle
  fixed_gnss_tier: rtk_fixed
  bay_occupancy_min: 0.0  # Still no parked cars.
  bay_occupancy_max: 0.0

carla_sensors:
  lidar:
    noise:
      enabled: false  # Phase A: clean sensors.

training_overrides:
  stage_timesteps: 3000000
  learning_rate: 0.00025
  learning_rate_final: 0.00005
  ent_coef: 0.013
  ent_coef_final: 0.006
