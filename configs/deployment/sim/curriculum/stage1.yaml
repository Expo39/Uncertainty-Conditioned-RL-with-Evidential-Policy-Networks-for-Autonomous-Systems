# Curriculum Stage 1 - single fixed bay, fixed spawn, no parked cars.
# Maximally easy so the +50 terminal fires often enough for PPO. See CURRICULUM_PLAN.md.
# Difficulty knobs are spelled out in full here (they live only in stage files).

use_extra_spawns: false  # Lock to the single primary spawn.
bay_margin: -0.75  # Strict acceptance box.

parking_scenarios:
  fixed_floor_plan: rectangle
  fixed_gnss_tier: rtk_fixed  # Clean localisation (Phase A).
  fixed_target_bay_id: perpendicular_0  # One fixed target bay.
  bay_occupancy_min: 0.0  # No parked cars.
  bay_occupancy_max: 0.0

carla_sensors:
  lidar:
    noise:
      enabled: false  # Phase A: clean sensors.

# Per-stage training budget and schedules (allowlisted, applied via --stage). Each
# stage restarts its LR / ent_coef decay over stage_timesteps; weights + VecNormalize
# carry over on resume.
training_overrides:
  stage_timesteps: 2000000
  learning_rate: 0.0003
  learning_rate_final: 0.00005
  # ent_coef sized against the NORMALISED reward. The /phi_start * PROGRESS_TARGET
  # transform makes a successful approach bank PROGRESS_TARGET (~11) per episode for
  # EVERY bay, i.e. ~0.028 reward/decision at convergence - the same dense scale as
  # every later stage. The entropy bonus ent_coef*H is reward-scale-independent (H
  # depends only on the policy std, ~2.1 at the operating std), so a value sized for
  # the old un-normalised reward (0.02) dwarfs the per-decision gradient and the
  # policy never commits. 0.006 keeps the start bonus near parity with the reward
  # gradient - a genuine exploration nudge, not a dominating term. The floor decays
  # to 0.001 so that once the policy has converged (std ~0.5, reward gradient quiet
  # near the optimum) the entropy bonus drops to ~0.08x the reward gradient and gets
  # out of the way, letting the committed policy HOLD rather than re-inflating its
  # std off the optimum late in training. Matches stage 2 by design: both stages
  # share the normalised reward scale, so one principled ent_coef serves both.
  ent_coef: 0.006
  ent_coef_final: 0.001
