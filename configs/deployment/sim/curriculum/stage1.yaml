# Curriculum Stage 1 - bootstrap the perpendicular corridor approach (4 bays, loosest
# margin). Primary axis: the parking manoeuvre itself; bay count and margin ramp later.

use_extra_spawns: false  # Single primary spawn (off in every stage).
bay_margin: -0.75  # Loosest acceptance box (negative inflates it outward).

parking_scenarios:
  fixed_floor_plan: rectangle  # Training layout; irregular held out for OOD eval.
  # fixed_gnss_tier omitted: start tier is SAMPLED from the init weights in
  # gnss_noise_profiles.yaml (any fix state), then wanders via the Markov chain.
  allowed_bay_ids:  # Drop the radial-homing crutch (25); keep a straight-in anchor (38).
    - perpendicular_0    # cluster 0-11,  yaw 270, lower row (turn-in, right of spawn)
    - perpendicular_22   # cluster 12-24, yaw 90,  south row (turn-in, opposite orientation)
    - perpendicular_37   # cluster 33-37, yaw 270, upper row east block (far - forces corridor setup)
    - perpendicular_38   # cluster 38-46, yaw 180, east column (straight-in anchor; clear corridor along the main aisle)
  bay_occupancy_min: 0.0  # Include EMPTY lots: careful-under-uncertainty is needed
  # most in open space (no LiDAR to resolve a bad EKF pose), so empty must be
  # in-distribution or the empty-lot covariance eval is OOD. Applied every stage.
  bay_occupancy_max: 0.1

carla_sensors:
  lidar:
    noise:
      enabled: true  # Constant realism floor (on in every stage).

# standard_overrides (vanilla, input_uncertainty) / evidential_overrides
# (output_uncertainty, full_method), selected by policy_type; identical at init.
# stage_timesteps counts policy decisions (action_repeat ticks each).
standard_overrides:
  stage_timesteps: 1500000
  learning_rate: 0.0003
  learning_rate_final: 0.00005
  ent_coef: 0.003
  ent_coef_final: 0.0005
evidential_overrides:
  stage_timesteps: 1500000
  learning_rate: 0.0003
  learning_rate_final: 0.00005
  ent_coef: 0.003
  # Higher floor than the standard block: action std = sqrt(aleatoric), so a
  # collapsing head kills exploration (the standard log_std is decoupled).
  ent_coef_final: 0.0015
