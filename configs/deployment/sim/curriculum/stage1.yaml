# Curriculum Stage 1 - bootstrap: one bay per cluster (5 clusters, 3 orientations),
# light occupancy, loosest margin, gentle drift. See documentation/CURRICULUM_PLAN.md.
# Later stages keep these same 5 clusters and only raise the bays-per-cluster count.

use_extra_spawns: false  # Single primary spawn (off in every stage).
bay_margin: -0.75  # Loosest acceptance box (negative inflates it outward).

parking_scenarios:
  fixed_floor_plan: rectangle  # Training layout; trapezoid/irregular held out for OOD eval.
  fixed_gnss_tier: rtk_fixed  # Per-episode start tier.
  allowed_bay_ids:  # One forward-reachable bay per cluster (nearest, side-approach avoided).
    - perpendicular_0    # cluster 0-11,  yaw 270, lower row
    - perpendicular_22   # cluster 12-24, yaw 90,  south row
    - perpendicular_25   # cluster 25-32, yaw 270, upper row (left)
    - perpendicular_37   # cluster 33-37, yaw 270, upper row (right)
    - perpendicular_40   # cluster 38-46, yaw 180, east column
  bay_occupancy_min: 0.1
  bay_occupancy_max: 0.1

carla_sensors:
  lidar:
    noise:
      enabled: true  # Constant realism floor (on in every stage).

# standard_overrides (vanilla, input_uncertainty) / evidential_overrides
# (output_uncertainty, full_method), selected by policy_type; identical at init.
# ent_coef decays to the 0.0005 floor.
standard_overrides:
  stage_timesteps: 3000000
  learning_rate: 0.0003
  learning_rate_final: 0.00005
  ent_coef: 0.003
  ent_coef_final: 0.0005
evidential_overrides:
  stage_timesteps: 3000000
  learning_rate: 0.0003
  learning_rate_final: 0.00005
  ent_coef: 0.003
  ent_coef_final: 0.0005
