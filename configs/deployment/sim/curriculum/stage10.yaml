# Curriculum Stage 10 - full realistic drift (the capstone). Resume from Stage 9.
# Primary axis: GNSS drift_scale reaches 1.0 (the full Markov chain); geometry,
# margin and occupancy frozen. Noise master switches in configs/ros2_config.yaml are
# on globally from Stage 1; drift_scale does the per-stage ramp.

use_extra_spawns: false
bay_margin: -0.25  # Strict, held.

parking_scenarios:
  fixed_floor_plan: rectangle
  fixed_gnss_tier: rtk_fixed  # Per-episode start tier.
  drift_scale: 1.0
  bay_occupancy_min: 0.2
  bay_occupancy_max: 0.8

carla_sensors:
  lidar:
    noise:
      enabled: true  # Constant realism floor (on in every stage).

# Identical standard/evidential blocks - see Stage 1.
standard_overrides:
  stage_timesteps: 3500000
  learning_rate: 0.00015
  learning_rate_final: 0.00001
  ent_coef: 0.001
  ent_coef_final: 0.0005
evidential_overrides:
  stage_timesteps: 3500000
  learning_rate: 0.00015
  learning_rate_final: 0.00001
  ent_coef: 0.001
  ent_coef_final: 0.0005
