# Curriculum Stage 5 - full clean Phase A (the published training condition)
#
# Resume from Stage 4's final checkpoint. Full bay occupancy range (0.2-0.8) and
# the strict evaluation bay margin. This is the real Phase A task the dissertation
# reports; sensor noise (Phase B) is turned on separately in Stage 6. When this
# stage passes, the policy parks reliably among parked cars in clean conditions at
# the published success criterion.

use_extra_spawns: true

parking_scenarios:
  fixed_floor_plan: rectangle
  fixed_gnss_tier: rtk_fixed
  bay_occupancy_min: 0.2  # Full occupancy range (the base env_config setting).
  bay_occupancy_max: 0.8
  num_patrol_vehicles_max: 0
  pedestrian_spawn_probability: 0.0

bay_margin: -0.25  # Strict published criterion (matches STRICT_BAY_MARGIN).

training_overrides:
  stage_timesteps: 2000000
  learning_rate: 0.0002
  learning_rate_final: 0.00003
  ent_coef: 0.01
  ent_coef_final: 0.004
