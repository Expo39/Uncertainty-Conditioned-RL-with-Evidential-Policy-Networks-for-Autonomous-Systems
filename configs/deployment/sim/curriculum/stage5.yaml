# Curriculum Stage 5 - introduce parked cars (the avoidance task).
# Resume from Stage 4. Light occupancy (0.2-0.4); margin approaches the strict value.

use_extra_spawns: true
bay_margin: -0.25  # Strict criterion, held from stage 4. This stage adds parked cars as
                   # the single new axis; the square-park skill is already learned in the
                   # clean stages, so the margin does not change here.

parking_scenarios:
  fixed_floor_plan: rectangle
  fixed_gnss_tier: rtk_fixed
  bay_occupancy_min: 0.2  # Light occupancy - some neighbours.
  bay_occupancy_max: 0.4

carla_sensors:
  lidar:
    noise:
      enabled: false  # Phase A: clean sensors.

training_overrides:
  stage_timesteps: 2000000
  learning_rate: 0.00025
  learning_rate_final: 0.00005
  # Near the shared 0.0005 floor (resumed stage - see stage 2/3). Parked cars add one
  # axis but the geometry is frozen, so a modest nudge.
  ent_coef: 0.001
  ent_coef_final: 0.0005
