# Actuation calibration for sim-to-real transfer.
#
# Maps the policy's normalised action output [steering, throttle, brake] to
# physical actuator commands on the real vehicle. Steering is bipolar [-1, 1];
# throttle and brake are separate non-negative axes [0, 1]. No reverse gear.
#
# Ships with identity mappings (unit gain, zero deadband and bias): the policy
# command passes through unchanged. Each vehicle's response curve is measured at
# the test site and the per-axis terms set from it, since the mapping is a
# property of the specific drive-by-wire hardware rather than of the policy.

calibration:
  steering:
    # Policy steering [-1, 1] -> wheel angle command [-1, 1].
    gain: 1.0  # Command per unit policy output.
    deadband: 0.0  # Input below which the wheel does not move.
    deadband_offset: 0.0  # Asymmetry between left and right deadband.
    bias: 0.0  # Neutral offset (straight-ahead trim).
    min_output: -1.0
    max_output: 1.0

  throttle:
    # Policy throttle [0, 1] -> throttle command [0, 1].
    gain: 1.0  # Command per unit policy output.
    deadband: 0.0  # Input below which the vehicle does not move.
    deadband_offset: 0.0  # Asymmetry in the throttle deadband.
    bias: 0.0  # Compensates creep at zero throttle.
    min_output: 0.0
    max_output: 1.0

  brake:
    # Policy brake [0, 1] -> brake command [0, 1].
    gain: 1.0  # Command per unit policy output.
    deadband: 0.0  # Input below which no braking occurs.
    deadband_offset: 0.0  # Asymmetry in the brake deadband.
    bias: 0.0  # Brake neutral offset.
    min_output: 0.0
    max_output: 1.0
