# Actuation calibration for sim-to-real transfer.
#
# Maps the policy's normalised action output [steering, throttle, brake] to
# physical actuator commands on the real vehicle. Steering is bipolar [-1, 1];
# throttle and brake are separate non-negative axes [0, 1]. No reverse gear.

calibration:
  steering:
    # Maps policy steering [-1, 1] to wheel angle command [-1, 1].
    # @warning UNCALIBRATED - identity mapping until measured.
    gain: 1.0  # TODO: measure from steering response
    deadband: 0.0  # TODO: measure minimum input for non-zero steer
    deadband_offset: 0.0  # TODO: adjust if steering is asymmetric
    bias: 0.0  # TODO: adjust for any steering neutral offset
    min_output: -1.0
    max_output: 1.0

  throttle:
    # Maps policy throttle [0, 1] to throttle command [0, 1].
    # @warning UNCALIBRATED - identity mapping until measured.
    gain: 1.0  # TODO: measure from throttle response
    deadband: 0.0  # TODO: measure minimum input for vehicle motion
    deadband_offset: 0.0  # TODO: adjust for any input bias
    bias: 0.0  # TODO: adjust for creep at zero throttle
    min_output: 0.0
    max_output: 1.0

  brake:
    # Maps policy brake [0, 1] to brake command [0, 1].
    # @warning UNCALIBRATED - identity mapping until measured.
    gain: 1.0  # TODO: measure from brake response
    deadband: 0.0  # TODO: measure minimum input for non-zero braking
    deadband_offset: 0.0  # TODO: adjust for any input bias
    bias: 0.0  # TODO: adjust for any brake neutral offset
    min_output: 0.0
    max_output: 1.0
