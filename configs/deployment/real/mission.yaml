# Real-world mission configuration.
#
# Set target_bay_id to the bay the vehicle should park in before each mission.
# The ID must match the 'id' field of a bay in the chosen layout YAML.
#
# Procedure:
#   1. Open the bird's-eye PNG in outputs/layouts/<layout_name>.png to find
#      the bay ID you want (printed on each bay in the image).
#   2. Set target_bay_id below to that ID.
#   3. Set layout_file to the matching layout YAML path.
#   4. Restart the deployment process.

# Bay to park in. Edit before each mission.
target_bay_id: "B01"

# Layout YAML that defines the lot geometry and bay positions.
# Must match the physical lot at the deployment site.
layout_file: "configs/layouts/rectangle.yaml"
