# Real-world mission configuration, set before each mission.
#
# Bay IDs are printed on each bay in the layout PNG under
# outputs/raw_derived/layouts/; changes take effect on deployment restart.

# Must match a bay 'id' in the layout file below, e.g. "perpendicular_12".
target_bay_id: "B01"

# Layout YAML that defines the lot geometry and bay positions.
# Must match the physical lot at the deployment site.
layout_file: "configs/layouts/rectangle.yaml"
