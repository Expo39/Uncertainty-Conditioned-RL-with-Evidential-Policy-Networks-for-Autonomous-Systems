# ROS 2 configuration for the RTK-GNSS + IMU localisation pipeline.
#
# Pipeline summary:
#
#   /carla/ego_vehicle/gnss  (NavSatFix, raw CARLA GNSS with base RTK noise)
#       -> GnssNoiseRelayNode  (adds per-episode noise, stamps position_covariance)
#       -> /gnss/noisy  (NavSatFix with realistic covariance)
#       -> navsat_transform_node  (robot_localisation: UTM projection -> Odometry)
#       -> /odometry/gps  (Odometry in odom frame)
#
#   /carla/ego_vehicle/imu  (sensor_msgs/Imu)
#       -> EKF imu0: orientation + yaw rate PREDICTION step between GNSS fixes
#
#   robot_localisation EKF fuses both:
#       odom0 = /odometry/gps   (x, y, yaw from GNSS via navsat_transform)
#       imu0  = /carla/ego_vehicle/imu  (orientation, vyaw)
#       output = /odometry/filtered  (pose + 6x6 covariance)
#
#   CovarianceExtractorNode reads /odometry/filtered and writes ekf_state.json.
#   Training container reads ekf_state.json for obs[0-14] (velocity + covariance).
#
# EKF output covariance reflects RTK fix-state quality:
#   RTK fixed (~2 cm)    -> low covariance  -> confident parking
#   RTK float (~30 cm)   -> medium covariance -> cautious approach
#   Standalone (~2-5 m)  -> high covariance -> abort/handoff
# Per-episode RTK fix states are sampled from configs/carla/gnss_noise_profiles.yaml.
# The GnssNoiseRelayNode reads the tier from gnss_noise_config.json (shared volume).

# CARLA ROS bridge topic names (published automatically by the bridge)
carla_topics:
  imu: "/carla/ego_vehicle/imu"      # sensor_msgs/Imu
  gnss: "/carla/ego_vehicle/gnss"    # sensor_msgs/NavSatFix
  lidar: "/carla/ego_vehicle/lidar"  # sensor_msgs/PointCloud2 (2D, obstacle detection only)

# robot_localisation EKF node parameters.
# Loaded directly by carla_bridge.launch.py as node parameters.
ekf:
  frequency: 20.0        # EKF update rate (Hz) -- matches CARLA timestep
  two_d_mode: true       # Constrain to 2D: suppress z, roll, pitch states
  world_frame: "odom"    # EKF output frame. navsat_transform creates a stable
                         # UTM-aligned odom frame. _calibrate_ekf_frame_offset()
                         # computes the rigid transform from odom to CARLA world
                         # coordinates at episode reset.
  odom_frame: "odom"     # Must match world_frame for single-odom-source mode.
  base_link_frame: "ego_vehicle"  # Central body frame for all sensors.
  publish_tf: true

  # IMU sensor: prediction step.
  # Enabled: yaw orientation (index 5) and vyaw (index 11).
  # Linear acceleration disabled: CARLA bridge publishes zero IMU covariance,
  # so robot_localization would treat acceleration as infinitely reliable and
  # override the GNSS velocity corrections. Yaw rate alone is sufficient
  # to propagate the heading estimate between 20 Hz GNSS fixes.
  imu0: "/carla/ego_vehicle/imu"
  # 15-element list: [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
  imu0_config: [false, false, false, false, false, true,
                false, false, false, false, false, true,
                false, false, false]

  # GNSS-derived odometry: correction step.
  # Published by navsat_transform_node with covariance from the NavSatFix
  # position_covariance field (stamped by GnssNoiseRelayNode).
  # Enabled: x (0), y (1), yaw (5), vx (6), vy (7).
  odom0: "/odometry/gps"
  # 15-element list: [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
  odom0_config: [true, true, false, false, false, true,
                 true, true, false, false, false, false,
                 false, false, false]

# navsat_transform_node parameters (robot_localisation package).
# Converts NavSatFix -> Odometry via UTM projection.
navsat_transform:
  frequency: 20.0          # Publish rate (Hz), matches EKF frequency
  zero_altitude: true      # 2D operation: ignore altitude
  publish_filtered_gps: false  # Do not re-publish filtered GPS
  use_odometry_yaw: false  # Use IMU yaw, not GNSS-derived heading
  yaw_offset: 0.0          # Radians. Adjust if CARLA IMU convention differs from ENU.
  wait_for_datum: false     # Use first GNSS fix as datum (no manual datum needed)
  broadcast_utm_transform: true  # Publish TF: utm -> odom

# GnssNoiseRelayNode parameters.
# Subscribes to raw CARLA GNSS, adds per-episode noise, stamps covariance.
gnss_noise_relay:
  input_topic: "/carla/ego_vehicle/gnss"
  output_topic: "/gnss/noisy"
  base_metric_stddev_m: 0.02  # RTK-fixed baseline noise (metres)

# CovarianceExtractorNode configuration.
# Subscribes to /odometry/filtered, extracts 3x3 [x, y, yaw] covariance submatrix,
# and writes pose + covariance to ekf_state.json for the training container.
odom_topic: "/odometry/filtered"            # EKF output topic
covariance_topic: "/ekf_uncertainty/covariance"  # CovarianceEstimate publisher (unused in training -- file-based)
publish_rate: 10.0                           # Hz (file write rate)

# Velocity frame convention.
# robot_localisation with world_frame=odom publishes twist in the odom
# (world-aligned) frame, not the vehicle body frame. The extractor rotates
# it into body frame before writing to ekf_state.json.
# Set false only if robot_localisation is configured with twist_in_robot_frame: true.
twist_in_odom_frame: true

# Time source for ROS 2 nodes.
# The CARLA bridge node itself runs with use_sim_time=true and publishes /clock from
# CARLA's internal simulation time (UNIX epoch scale, ~1.77e9 s).
# All nodes that need consistent TF lookups must use the same time source as the bridge.
use_sim_time: true

# QoS settings for ROS 2 subscribers/publishers
qos:
  reliability: "reliable"
  history: "keep_last"
  depth: 10

# Logging
log_level: "info"   # debug, info, warn, error
log_rate: 1.0       # Log uncertainty statistics every N seconds
