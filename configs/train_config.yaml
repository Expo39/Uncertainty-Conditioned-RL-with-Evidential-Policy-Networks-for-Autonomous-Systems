# Training Configuration
# PPO hyperparameters, network architecture, evidential settings, and training schedule.
# Environment settings live in deployment/sim/env_config.yaml.

# PPO hyperparameters
learning_rate: 0.0003  # Initial LR; linear decay to learning_rate_final over the stage budget (stage_timesteps).
learning_rate_final: 0.00001  # Non-zero LR floor so an early-converging run keeps a live LR.
n_steps: 2048  # Steps per PPO update (~4.7 episodes at ~437 policy decisions each).
batch_size: 256
n_epochs: 5
gamma: 0.997  # Discount; effective horizon 1/(1-gamma) ~= 333 steps.
gae_lambda: 0.95
clip_range: 0.2
clip_range_vf: null  # No VF clipping (SB3 default).
ent_coef: 0.02  # Entropy bonus at start; linear decay to ent_coef_final.
ent_coef_final: 0.006  # Entropy floor (the action std is sqrt(aleatoric)).
vf_coef: 0.5
max_grad_norm: 0.5
target_kl: 0.04  # Early-stop epochs above this KL; clip_range is the primary safety, this a backup.

# Network architecture
net_arch: [256, 256]  # Actor and critic hidden layers.
activation: "relu"  # Options: relu, tanh, elu, leaky_relu.
log_std_init: -0.6  # Initial Gaussian action log-std (std ~= 0.55). Standard head only.

# Evidential network settings.
evidential:
  lambda_reg: 0.02  # Prior-anchor coefficient (target after warmup). Anchors alpha/beta near the prior. Brittle - do not over-raise (DER survey: quality decays even 0.01->0.03).
  lambda_reg_warmup_steps: 50000  # Steps to linearly anneal lambda_reg from 0 to target.
  lambda_evidence: 0.01  # Evidence-accrual coefficient (target after warmup). Drives nu off its prior so epistemic = beta/(nu*(alpha-1)) carries state-dependent signal (else nu is pinned and epistemic = aleatoric/nu_prior). Tune gently - too high collapses aleatoric.
  lambda_evidence_warmup_steps: 50000  # Steps to linearly anneal lambda_evidence from 0 to target (let PPO settle gamma first).
  lambda_nu_anchor: 0.0  # Log-space restoring force pulling nu back to its sub-1 prior; opposes lambda_evidence so nu reaches an equilibrium instead of collapsing epistemic onto aleatoric. 0 = unanchored (old behaviour).
  aleatoric_floor: 0.04  # Min predictive aleatoric (action variance); sampling std floored at sqrt(0.04)=0.2. Stops the NIG variance collapsing to a Dirac delta (exploration death). Evidential-actor analogue of the SAC log_std clamp. Tunable.
  use_uncertainty_conditioning: false  # Route covariance through a dual-encoder pathway. False keeps the 2x2 ablation clean (covariance enters identically for both heads).

# Logging and checkpointing
checkpoint_freq: 50000  # Save checkpoint every N steps.
log_interval: 1  # Log every PPO update.
verbose: 1  # SB3 verbosity: 0=silent, 1=info, 2=debug.
log_dir: "./logs"
checkpoint_dir: "./checkpoints"

# Training schedule
# The run budget is the active stage's stage_timesteps (curriculum file), which the
# LR/ent_coef schedules decay over. A run with no stage falls back to train_ppo.py's
# 1,000,000-step default.
seed: 42  # Master RNG seed. The ablation runs multiple seeds via --seed / the Makefile, not a list here.
eval_freq: 10000  # Evaluate every N steps (reserved, eval_env currently disabled).
n_eval_episodes: 10  # Episodes per evaluation (reserved, eval_env currently disabled).
success_rate_window: 50  # Episodes the logged terminal rates are averaged over (a per-rollout rate is too noisy).

# Parallel workers. Each worker connects to a separate CARLA server on base_port + rank*1000.
parallel_workers: 1
