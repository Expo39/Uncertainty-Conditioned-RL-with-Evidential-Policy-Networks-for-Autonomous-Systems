# Training Configuration for Uncertainty-Conditioned RL
# This configuration file contains parameters for training the PPO agent

# Environment settings
carla_host: "localhost"
carla_port: 2000
town: "Town01"
max_steps: 500  # Maximum episode length
carla_timestep: 0.05  # Simulation timestep (seconds), 20 Hz

# ROS 2 covariance subscription settings
# The training container subscribes to real EKF covariance via DDS
ros2:
  covariance_topic: "/ekf_uncertainty/covariance"  # Float64MultiArray from CovarianceExtractorNode
  covariance_timeout: 10.0  # Seconds to wait for first covariance message per episode

# CARLA sensor noise configuration
# These parameters control the noise injected into CARLA's virtual sensors,
# which in turn drives EKF uncertainty. Higher noise -> higher covariance.
carla_sensors:
  imu:
    noise_accel_stddev_x: 0.1   # Accelerometer noise (m/s^2)
    noise_accel_stddev_y: 0.1
    noise_accel_stddev_z: 0.1
    noise_gyro_stddev_x: 0.01   # Gyroscope noise (rad/s)
    noise_gyro_stddev_y: 0.01
    noise_gyro_stddev_z: 0.01
    sensor_tick: 0.05           # Publish rate (seconds), matches carla_timestep
  gnss:
    noise_alt_stddev: 0.5       # Altitude noise (metres)
    noise_lat_stddev: 0.00001   # Latitude noise (degrees, ~1.1 m at equator)
    noise_lon_stddev: 0.00001   # Longitude noise (degrees, ~1.1 m at equator)
    noise_alt_bias: 0.0
    noise_lat_bias: 0.0
    noise_lon_bias: 0.0
    sensor_tick: 0.1            # Publish rate (seconds)

# CARLA environmental conditions
# Randomised per episode during training to expose the agent to varied uncertainty
carla_conditions:
  weather_presets:               # Randomly sampled each episode
    - "ClearNoon"
    - "CloudyNoon"
    - "WetNoon"
    - "SoftRainNoon"
    - "HardRainNoon"
    - "ClearSunset"
    - "CloudySunset"
  fog_density_range: [0.0, 50.0]     # Uniform random range per episode (0-100 scale)
  fog_distance_range: [20.0, 100.0]  # Minimum fog distance (metres)
  num_vehicles: 20                    # NPC vehicles via traffic manager
  num_pedestrians: 10                 # NPC pedestrians

# PPO hyperparameters
learning_rate: 0.0003
n_steps: 2048  # Number of steps to run for each environment per update
batch_size: 64  # Minibatch size
n_epochs: 10  # Number of epochs when optimising the surrogate loss
gamma: 0.99  # Discount factor
gae_lambda: 0.95  # Factor for trade-off of bias vs variance for GAE
clip_range: 0.2  # Clipping parameter for PPO
clip_range_vf: null  # Clipping parameter for value function (null = no clipping)
ent_coef: 0.01  # Entropy coefficient for exploration
vf_coef: 0.5  # Value function coefficient
max_grad_norm: 0.5  # Maximum value for gradient clipping

# Network architecture
net_arch: [256, 256]  # Hidden layer sizes for both actor and critic
activation: "relu"  # Activation function

# Logging and checkpointing
checkpoint_freq: 50000  # Save checkpoint every N steps
log_interval: 10  # Log every N episodes

# Training settings
total_timesteps: 1000000
seed: 42
random_seeds: [42, 123, 456, 789, 1011]  # For multi-seed ablation studies
eval_freq: 10000  # Evaluate every N training steps

# Evidential network settings
evidential:
  lambda_reg: 0.01  # Regularisation coefficient for evidential loss
  use_uncertainty_conditioning: true  # Condition policy on EKF localisation uncertainty
  
# Uncertainty settings
uncertainty:
  epistemic_weight: 1.0  # Weight for epistemic uncertainty in loss
  aleatoric_weight: 1.0  # Weight for aleatoric uncertainty in loss

