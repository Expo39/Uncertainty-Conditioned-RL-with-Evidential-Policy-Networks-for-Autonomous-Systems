# Evaluation Configuration
# Configuration for evaluating trained agents across physical conditions
# that produce varying EKF uncertainty levels.
#
# Only ClearNoon and HardRainNoon are used: fog does not render on the
# generated OpenDRIVE FlatPlane world, so LiDAR-relevant differentiation
# comes from weather (rain scatter), IMU noise multipliers, and traffic density.

# Model settings
model_path: "checkpoints/final_model"  # Path to trained model

# Environment settings
carla_host: "localhost"
carla_port: 2000
town: "FlatPlane"  # Special value: loads configs/layouts/flat_plane.xodr via generate_opendrive_world()
max_steps: 500

# ROS 2 covariance subscription (same topic as training)
ros2:
  covariance_topic: "/ekf_uncertainty/covariance"
  covariance_timeout: 10.0

# Evaluation settings
n_episodes: 100  # Episodes per condition
deterministic: true  # Use deterministic actions
render: false  # Render episodes (requires display)

# Evaluation conditions sweep
# Each condition specifies weather, IMU noise multiplier, and traffic density.
# Base IMU noise comes from train_config.yaml carla_sensors.imu.*; multiplier scales it.
# No GNSS: excluded from Suite A (unreliable in covered parking lots).
# EKF uncertainty variation comes from LiDAR scan-matching quality + IMU drift:
#   - Fewer parked cars -> sparser LiDAR features -> higher covariance
#   - Rain (HardRainNoon) -> LiDAR scatter -> degraded scan-match -> higher covariance
#   - Dynamic actors (patrol, pedestrians) -> occlusions -> transient covariance spikes
#   - Higher IMU noise multiplier -> noisier prediction step -> higher covariance
# Ordered from easiest (low uncertainty) to hardest (extreme uncertainty).
eval_conditions:
  - name: "clear_low_noise"
    description: "Clear weather, 0.5x IMU noise, no traffic -- best-case LiDAR conditions"
    weather_preset: "ClearNoon"
    imu_noise_multiplier: 0.5
    num_patrol_vehicles: 0
    pedestrian_spawn_probability: 0.0
    bay_occupancy_rate: 0.6

  - name: "clear_nominal"
    description: "Clear weather, 1.0x IMU noise, 1 patrol, all pedestrian zones -- training distribution"
    weather_preset: "ClearNoon"
    imu_noise_multiplier: 1.0
    num_patrol_vehicles: 1
    pedestrian_spawn_probability: 1.0
    bay_occupancy_rate: 0.6

  - name: "clear_sparse_lot"
    description: "Clear weather, 1.0x IMU noise, sparse bays -- fewer LiDAR anchors"
    weather_preset: "ClearNoon"
    imu_noise_multiplier: 1.0
    num_patrol_vehicles: 0
    pedestrian_spawn_probability: 0.0
    bay_occupancy_rate: 0.3  # Sparse end of training range: fewer parked cars = fewer scan-match features

  - name: "clear_full"
    description: "Clear weather, 1.5x IMU noise, 1 patrol, all zones, full lot -- dynamic occlusions"
    weather_preset: "ClearNoon"
    imu_noise_multiplier: 1.5
    num_patrol_vehicles: 1
    pedestrian_spawn_probability: 1.0
    bay_occupancy_rate: 0.8

  - name: "rain_nominal"
    description: "Heavy rain, 1.0x IMU noise, 1 patrol, all zones -- rain scatter degrades LiDAR"
    weather_preset: "HardRainNoon"
    imu_noise_multiplier: 1.0
    num_patrol_vehicles: 1
    pedestrian_spawn_probability: 1.0
    bay_occupancy_rate: 0.6

  - name: "rain_degraded"
    description: "Heavy rain, 2.0x IMU noise, 1 patrol, all zones -- compound degradation"
    weather_preset: "HardRainNoon"
    imu_noise_multiplier: 2.0
    num_patrol_vehicles: 1
    pedestrian_spawn_probability: 1.0
    bay_occupancy_rate: 0.6

  - name: "rain_full"
    description: "Heavy rain, 3.0x IMU noise, 1 patrol, all zones, full lot -- maximum stress"
    weather_preset: "HardRainNoon"
    imu_noise_multiplier: 3.0
    num_patrol_vehicles: 1
    pedestrian_spawn_probability: 1.0
    bay_occupancy_rate: 0.8

  # OOD floor plan evaluation (calibration experiment)
  # Uses irregular_a (nine-sided polygon, held out entirely from training).
  # Tests whether epistemic uncertainty rises on novel lot geometry
  # without any reward signal indicating novelty -- a calibration check on the
  # evidential policy's NIG prior.
  - name: "ood_nominal"
    description: "OOD floor plan (irregular_a), nominal conditions -- calibration check"
    weather_preset: "ClearNoon"
    imu_noise_multiplier: 1.0
    num_patrol_vehicles: 1
    pedestrian_spawn_probability: 1.0
    bay_occupancy_rate: 0.6
    floor_plan: "irregular_a"  # Override: use OOD floor plan

  - name: "ood_degraded"
    description: "OOD floor plan (irregular_a) + heavy rain -- compound novelty"
    weather_preset: "HardRainNoon"
    imu_noise_multiplier: 2.0
    num_patrol_vehicles: 1
    pedestrian_spawn_probability: 1.0
    bay_occupancy_rate: 0.6
    floor_plan: "irregular_a"

  # Worst-case / safety handoff demonstration
  # Familiar training geometry under conditions far beyond the training distribution.
  # Expected: empty lot removes scan-match anchors, rain degrades remaining returns,
  # EKF covariance spikes, evidential epistemic uncertainty crosses the safety
  # handoff threshold -- demonstrating the core safety capability.
  - name: "worst_case"
    description: "Safety handoff demo: heavy rain + empty lot + max IMU noise + all pedestrian zones"
    weather_preset: "HardRainNoon"
    imu_noise_multiplier: 6.0      # Well beyond training range (training: 0.5x-3.0x)
    num_patrol_vehicles: 0         # No patrol -- focus on LiDAR/IMU degradation
    pedestrian_spawn_probability: 1.0  # All zones occupied -- maximum occlusion
    bay_occupancy_rate: 0.0        # Zero parked cars -- no scan-match anchors
    floor_plan: "rectangle"        # Familiar training geometry (not OOD)

# Output settings
output_dir: "evaluation_results"
save_plots: true
save_csv: true

# Success criteria
success_criteria:
  position_threshold: 0.5  # metres
  orientation_threshold: 10.0  # degrees
  velocity_threshold: 0.1  # m/s
