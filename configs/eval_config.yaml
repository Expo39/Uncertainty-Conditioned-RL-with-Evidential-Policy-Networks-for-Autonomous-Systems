# Evaluation Configuration
# Configuration for evaluating trained agents across uncertainty levels

# Model settings
model_path: "checkpoints/final_model"  # Path to trained model

# Environment settings
carla_host: "localhost"
carla_port: 2000
town: "Town01"
max_steps: 500

# Evaluation settings
n_episodes: 100  # Episodes per noise level
deterministic: true  # Use deterministic actions
render: false  # Render episodes (requires display)

# Uncertainty noise levels to evaluate (metres)
# Denser coverage in 0.1-1.0 range where performance transition occurs
noise_levels:
  - 0.05   # Perfect localisation
  - 0.1    # Nominal (training condition)
  - 0.2    # Mildly degraded
  - 0.5    # Degraded
  - 0.75   # Moderately degraded
  - 1.0    # Heavily degraded
  - 2.0    # Severe degradation
  - 5.0    # Extreme degradation

# Output settings
output_dir: "evaluation_results"
save_plots: true
save_csv: true

# Success criteria
success_criteria:
  position_threshold: 0.5  # metres
  orientation_threshold: 10.0  # degrees
  velocity_threshold: 0.1  # m/s
