# Evaluation Configuration
# Condition sweep across GNSS noise tiers and traffic densities.
# gnss_noise_multiplier scales the base RTK-fixed noise (0.02 m stddev).
# See detailed_notes/ekf_pipeline.md for tier-to-multiplier mapping.

model_path: "checkpoints/final_model"

carla_host: "uncertainty-rl-carla-0"  # Worker 0 container name.
carla_port: 2000
town: "FlatPlane"
max_steps: 1500  # Must match env_config.yaml max_steps.
map_load_sleep: 5.0

ros2:
  covariance_topic: "/odometry/filtered"
  covariance_timeout: 10.0

n_episodes: 100  # Episodes per condition.
deterministic: true  # Use deterministic (mean) actions.
debug: false

eval_conditions:
  # Nominal conditions (policy should park successfully)
  - name: "nominal_empty"
    description: "RTK fixed, empty lot"
    gnss_noise_multiplier: 1.0  # RTK fixed (~2 cm)
    imu_noise_multiplier: 1.0
    num_patrol_vehicles: 0
    pedestrian_spawn_probability: 0.0
    bay_occupancy_rate: 0.6

  - name: "nominal_busy"
    description: "RTK fixed, full traffic - training distribution"
    gnss_noise_multiplier: 1.0  # RTK fixed (~2 cm)
    imu_noise_multiplier: 1.0
    num_patrol_vehicles: 1
    pedestrian_spawn_probability: 1.0
    bay_occupancy_rate: 0.8

  # GNSS degradation sweep
  - name: "rtk_float"
    description: "RTK float (~30 cm), moderate traffic"
    gnss_noise_multiplier: 15.0  # RTK float (~30 cm)
    imu_noise_multiplier: 1.0
    num_patrol_vehicles: 1
    pedestrian_spawn_probability: 0.8
    bay_occupancy_rate: 0.6

  - name: "rtk_float_busy"
    description: "RTK float (~30 cm), full traffic"
    gnss_noise_multiplier: 15.0  # RTK float (~30 cm)
    imu_noise_multiplier: 1.5
    num_patrol_vehicles: 1
    pedestrian_spawn_probability: 1.0
    bay_occupancy_rate: 0.8

  - name: "rtk_standalone"
    description: "Standalone GNSS (~2 m), moderate traffic - policy should abort"
    gnss_noise_multiplier: 100.0  # Standalone (~2 m)
    imu_noise_multiplier: 1.0
    num_patrol_vehicles: 1
    pedestrian_spawn_probability: 0.8
    bay_occupancy_rate: 0.6

  - name: "rtk_lost"
    description: "Degraded GNSS (~5 m), busy lot - safety handoff expected"
    gnss_noise_multiplier: 250.0  # Degraded (~5 m)
    imu_noise_multiplier: 2.0
    num_patrol_vehicles: 1
    pedestrian_spawn_probability: 1.0
    bay_occupancy_rate: 0.8

  # OOD floor plan evaluation - epistemic uncertainty calibration check
  - name: "ood_layout"
    description: "OOD floor plan (irregular_a), RTK fixed"
    gnss_noise_multiplier: 1.0
    imu_noise_multiplier: 1.0
    num_patrol_vehicles: 1
    pedestrian_spawn_probability: 1.0
    bay_occupancy_rate: 0.6
    floor_plan: "irregular_a"

  - name: "ood_layout_degraded"
    description: "OOD floor plan (irregular_a), RTK float"
    gnss_noise_multiplier: 15.0
    imu_noise_multiplier: 1.5
    num_patrol_vehicles: 1
    pedestrian_spawn_probability: 1.0
    bay_occupancy_rate: 0.6
    floor_plan: "irregular_a"

  # Safety handoff demonstration - beyond training distribution
  - name: "worst_case"
    description: "Degraded GNSS + max IMU noise - safety handoff demo"
    gnss_noise_multiplier: 250.0  # Degraded (~5 m)
    imu_noise_multiplier: 6.0  # Beyond training range (0.5x-3.0x)
    num_patrol_vehicles: 0
    pedestrian_spawn_probability: 1.0
    bay_occupancy_rate: 0.0
    floor_plan: "rectangle"

output_dir: "evaluation_results"

success_criteria:
  position_threshold: 0.5  # metres
  orientation_threshold: 10.0  # degrees
  velocity_threshold: 0.1  # m/s
