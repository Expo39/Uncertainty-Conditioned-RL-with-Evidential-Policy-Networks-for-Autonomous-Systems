# Evaluation Configuration
# De-confounded condition sweep for the ablation study: every condition varies
# exactly ONE factor against the in-distribution anchor (rectangle lot, bay
# occupancy 0.5, no dynamic actors - training has static parked cars only).
# Connection, timing and ROS 2 settings come from env_config.yaml (single
# source of truth); this file holds only the condition sweep and eval options.
#
# GNSS levels: a condition with held_gnss_tier names one RTK fix-state tier from
# configs/deployment/sim/gnss_noise_profiles.yaml (rtk_fixed, rtk_float,
# standalone, degraded) and holds it for the whole episode (bypasses tier
# sampling and Markov drift) so the level is a controlled independent variable.
# A condition WITHOUT the key runs the training noise process itself:
# per-episode tier sampling + mid-episode Markov drift.
#
# imu_noise_multiplier / lidar_noise_multiplier scale the CARLA sensor stddev
# values above the fixed training noise floor (bias and tick-rate keys are
# never scaled). LiDAR noise itself is always enabled at eval, matching the
# constant realism floor every training stage runs with.

model_path: "checkpoints/final_model"  # Overridden by make docker-eval.

n_episodes: 100  # Episodes per condition. Use 200+ for final headline runs.
deterministic: true  # Use deterministic (mean) actions.
debug: false

# Timed-out episodes ending closer than this (m) to the bay are classed
# near_miss (precision shortfall); farther ones stuck (blocked/abandoned).
near_miss_threshold_m: 1.5

eval_conditions:
  # Deployment anchor: the exact noise process training ran (per-episode RTK
  # fix-state tier sampling + mid-episode Markov drift). This is the condition
  # the real instrumented lot would actually run.
  - name: "anchor_deployment"
    description: "Training GNSS process (tier sampling + Markov drift), occupancy 0.5"
    bay_occupancy_rate: 0.5

  # Same GNSS process as the anchor but an EMPTY lot (occupancy 0.0): the
  # no-obstacle control. With zero parked cars the LiDAR channel (obs 8-12) sees
  # nothing, so the policy must park on localisation alone (EKF speed +
  # covariance + bay-direction), with the obstacle-avoidance crutch removed. The
  # drift is mostly RTK-fixed, so the bay-direction obs is trustworthy and the
  # car can still park - the empty lot is a fair control here, NOT the broken
  # held-degraded-empty case (a degraded fix in an empty lot has no GNSS-
  # independent bay signal, since bays carry no physical markers - only
  # neighbour cars are LiDAR-visible). The anchor/anchor_empty pair isolates how
  # much the policy leans on neighbours versus localisation.
  - name: "anchor_empty"
    description: "Training GNSS process, EMPTY lot (occupancy 0.0) - no-obstacle control"
    bay_occupancy_rate: 0.0

  # --- GNSS axis: degradation-slope endpoints (occupancy 0.5, rectangle) --
  # Hold one RTK fix-state tier constant all episode (bypassing the Markov
  # chain) so the localisation level is a controlled independent variable. Only
  # the slope ENDPOINTS are kept: fixed (clean baseline) and degraded (worst).
  # The intermediate float/standalone tiers are dropped - their EKF error
  # (~0.36/0.47 m) sits inside the bay's lateral slack at occupancy 0.5, so the
  # covariance arms and the blind arms are indistinguishable there (no signal,
  # only eval time).
  - name: "gnss_fixed"
    description: "RTK fixed (~2 cm) held - clean baseline (slope start)"
    held_gnss_tier: rtk_fixed
    bay_occupancy_rate: 0

  - name: "gnss_degraded"
    description: "Degraded GNSS (~5 m, worst tier) held - slope end"
    held_gnss_tier: degraded
    bay_occupancy_rate: 0.5

  # --- LiDAR axis (GNSS pinned at RTK fixed, occupancy 0.5, rectangle) ----
  # Degrades only the obstacle channel (obs 8-12). The EKF fuses GNSS + IMU and
  # never consumes LiDAR, so the localisation stds stay at the RTK-fixed floor:
  # an EKF-std safety gate is structurally blind to this condition, while the
  # evidential head sees the corrupted obstacle features. Multiplier scales the
  # 0.020 m datasheet stddev floor; 25x = 0.5 m 1-sigma range noise (a failing
  # or interfered sensor, far beyond any in-distribution level).
  - name: "lidar_degraded"
    description: "25x LiDAR range noise (0.5 m 1-sigma), RTK fixed - EKF-blind degradation"
    held_gnss_tier: rtk_fixed
    lidar_noise_multiplier: 25.0
    bay_occupancy_rate: 0.5

  # --- Generalisation: unseen geometry (occupancy 0.5) --------------------
  # irregular_a is the designated OOD layout (training is rectangle only) - the
  # epistemic-uncertainty / generalisation check. One point (RTK fixed) is kept:
  # at clean GNSS the only OOD factor is the layout, so it isolates
  # generalisation from localisation degradation. The float variant is dropped
  # (same reason float is dropped from the GNSS axis - no covariance signal).
  - name: "ood_irregular_rtk_fixed"
    description: "OOD floor plan (irregular_a), RTK fixed (~2 cm)"
    held_gnss_tier: rtk_fixed
    bay_occupancy_rate: 0.5
    floor_plan: "irregular_a"
