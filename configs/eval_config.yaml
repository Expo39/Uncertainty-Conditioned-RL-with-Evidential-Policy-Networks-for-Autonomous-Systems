# De-confounded condition sweep for the ablation study: every condition varies
# exactly ONE factor against the in-distribution anchor (rectangle lot, bay
# occupancy 0.5, no dynamic actors). Connection, timing and ROS 2 settings come
# from env_config.yaml; this file holds only the sweep and eval options.
#
# held_gnss_tier pins one tier from gnss_noise_profiles.yaml for the whole
# episode, bypassing sampling and Markov drift so the level is a controlled
# variable; omitting it runs the training noise process instead. The
# *_noise_multiplier keys scale CARLA sensor stddevs above the training floor
# (bias and tick-rate are never scaled).

model_path: "checkpoints/final_model"  # Overridden by make docker-eval.

n_episodes: 200  # Episodes per condition. Use 200+ for final headline runs.
deterministic: true  # Use deterministic (mean) actions.
debug: false

# Timed-out episodes ending closer than this (m) to the bay are classed
# near_miss (precision shortfall); farther ones stuck (blocked/abandoned).
near_miss_threshold_m: 1.5

eval_conditions:
  # Deployment anchor: the exact noise process training ran (per-episode RTK
  # fix-state tier sampling + mid-episode Markov drift). This is the condition
  # the real instrumented lot would actually run.
  - name: "anchor_deployment"
    description: "Training GNSS process (tier sampling + Markov drift), occupancy 0.5"
    bay_occupancy_rate: 0.5

  # No-obstacle control: with no parked cars the LiDAR channel sees nothing, so
  # the pair with the anchor isolates reliance on neighbours versus localisation.
  # Fair only because the drift stays mostly RTK-fixed - bays carry no physical
  # markers, so a degraded fix in an empty lot leaves no bay signal at all.
  - name: "anchor_empty"
    description: "Training GNSS process, EMPTY lot (occupancy 0.0) - no-obstacle control"
    bay_occupancy_rate: 0.0

  # GNSS axis, slope endpoints only: fixed (clean) and degraded (worst). The
  # intermediate float/standalone tiers are dropped because their EKF error sits
  # inside the bay's lateral slack at occupancy 0.5, leaving the covariance and
  # blind arms indistinguishable - no signal, only eval time.
  - name: "gnss_fixed"
    description: "RTK fixed (~2 cm) held - clean baseline (slope start)"
    held_gnss_tier: rtk_fixed
    # Occupancy matched to gnss_degraded (0.5) so the GNSS tier is the ONLY
    # variable across the slope; neighbour cars are the LiDAR landmark mechanism.
    bay_occupancy_rate: 0.5

  - name: "gnss_degraded"
    description: "Degraded GNSS (~5 m, worst tier) held - slope end"
    held_gnss_tier: degraded
    bay_occupancy_rate: 0.5

  # LiDAR axis: degrades only the obstacle channel. The EKF never consumes
  # LiDAR, so its stds stay at the RTK-fixed floor and an EKF-std safety gate is
  # structurally blind here, while the evidential head sees the corruption.
  # 25x the 0.020 m datasheet floor = 0.5 m 1-sigma, a failing sensor.
  - name: "lidar_degraded"
    description: "25x LiDAR range noise (0.5 m 1-sigma), RTK fixed - EKF-blind degradation"
    held_gnss_tier: rtk_fixed
    lidar_noise_multiplier: 25.0
    bay_occupancy_rate: 0.5

  # irregular_a is the designated OOD layout (training is rectangle only), the
  # epistemic-uncertainty check. Held at RTK fixed so the layout is the ONLY OOD
  # factor, isolating generalisation from localisation degradation. The float
  # variant is dropped for the same no-signal reason as on the GNSS axis.
  - name: "ood_irregular_rtk_fixed"
    description: "OOD floor plan (irregular_a), RTK fixed (~2 cm)"
    held_gnss_tier: rtk_fixed
    bay_occupancy_rate: 0.5
    floor_plan: "irregular_a"

  # Starts at rtk_fixed and walks DOWN the ladder only. Unlike the held
  # worst-tier gnss_degraded, this gives a within-episode trajectory from
  # confident to ignorant - the discriminating test of whether uncertainty and
  # caution track the ONSET rather than the spawn condition.
  - name: "gnss_degrade_one_way"
    description: "Starts RTK fixed, drifts one-way to degraded (never recovers)"
    degrade_one_way: true  # Mutually exclusive with held_gnss_tier.
    # Compresses the drift schedule without touching the ladder, noise levels or
    # the one-way ratchet. At 1.0 the walk to degraded takes ~27 s against a
    # ~17 s episode, so only ~31% of episodes reach the worst tier; raise it to
    # trade realism for handover-latency sample size.
    degrade_rate_scale: 1.0
    bay_occupancy_rate: 0.5  # Keeps neighbour cars as a landmark once GNSS goes.
