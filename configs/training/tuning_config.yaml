# Hyperparameter Tuning Configuration
# Optuna study settings and search space bounds for PPO + evidential policy networks.

study_name: "uncertainty_rl_tuning"  # Per-baseline runs suffix this with the baseline name.
storage_path: "logs/tuning/optuna_study.db"  # SQLite for resume. Per-baseline runs suffix the filename.
n_trials: 40   # Budget for the structural-parameter search space.
timesteps_per_trial: 100000  # 24-98 PPO updates depending on sampled n_steps; ranks configs without full convergence (equal-timestep comparison favours sample efficiency).
tuning_seed: 777  # TPE sampler seed (the only tuning seed); disjoint from train_config seeds so tuning and eval splits differ.

sampler:
  multivariate: true  # Captures parameter interactions (e.g. n_steps vs batch_size).
  n_startup_trials: 12  # Random exploration before TPE builds its density model.

pruner:
  n_startup_trials: 8  # First 8 trials run to completion.
  n_warmup_steps: 5  # ~10k steps before pruning begins.
  n_min_trials: 5  # Require 5 completed trials before pruning any.

# STRUCTURAL PPO params only. learning_rate and ent_coef are stage-owned, so
# tuning them here is a no-op; net_arch/activation/policy_type are architectural
# and locked; evidential.* cannot be tuned on vanilla without breaking fairness.
# @see documentation/detailed_notes/ablation_hpo_methodology.md.
search_space:
  n_steps: [1024, 2048, 4096]  # Categorical.
  batch_size: [64, 128, 256]  # Categorical; constrained <= n_steps in code.
  n_epochs: [3, 5, 10]  # Categorical.
  gamma: [0.98, 0.999]  # Sampled via 1-(1-gamma) log scale.
  gae_lambda: [0.90, 0.98]  # GAE bias-variance trade-off.
  clip_range: [0.1, 0.3]  # PPO trust region width.
  vf_coef: [0.25, 1.0]  # Value-loss weight.
  max_grad_norm: [0.3, 2.0]  # Gradient clipping norm.
