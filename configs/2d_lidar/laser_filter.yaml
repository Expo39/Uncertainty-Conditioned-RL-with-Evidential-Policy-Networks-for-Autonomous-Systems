# @file laser_filter.yaml
# @brief Laser filter chain for scan_to_scan_filter_chain (ROS 2 laser_filters).
#
# Clips the 360 deg CARLA LiDAR scan to 270 deg (rear 90 deg blocked by vehicle
# body), matching the real SICK TiM 5xx field of view.
#
# Top-level key must match the node name in carla_bridge.launch.py.
# Filters are numbered sequentially (filter1, filter2, ...) with no gaps.
#
# Angular bounds:
#   -2.356 rad = -135 deg (left limit)
#    2.356 rad =  135 deg (right limit)
#
# @see uncertainty_rl/ros2/launch/carla_bridge.launch.py
# @see configs/train_config.yaml carla_sensors.lidar.filter_angle_min/max
lidar_angular_filter:
  ros__parameters:
    filter1:
      name: angular_bounds_filter
      type: laser_filters/LaserScanAngularBoundsFilter
      params:
        lower_angle: -2.356
        upper_angle: 2.356
