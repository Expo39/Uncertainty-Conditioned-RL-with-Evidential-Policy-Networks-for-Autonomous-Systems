# Baseline: Input Uncertainty Only
# Observation: vehicle state + EKF covariance + relative target pose + obstacle clearance.
# The agent sees localisation uncertainty but uses a standard Gaussian policy.

baseline_name: "input_uncertainty"

include_covariance: true
include_obstacle_obs: true
policy_type: "standard"

log_dir: "./logs/input_uncertainty"
checkpoint_dir: "./checkpoints/input_uncertainty"
