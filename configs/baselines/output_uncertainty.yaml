# Baseline: Output Uncertainty Only
# 9-dim state [x, y, yaw, vx, vy, vyaw, dx, dy, dyaw], evidential actor.
# The agent sees EKF pose + relative target but no EKF covariance.
# The policy quantifies its own epistemic and aleatoric uncertainty via NIG distributions.
# (6-dim EKF pose + 3-dim relative target pose = 9-dim total)
#
# Ablation dimensions:
#   include_covariance: false  (9-dim observation: EKF pose + relative target)
#   policy_type: evidential    (EvidentialActorCriticPolicy + EvidentialPPO)
#
# All other parameters inherited from configs/train_config.yaml.

baseline_name: "output_uncertainty"
baseline_description: "9-dim state (pose + target, no covariance), evidential actor"

include_covariance: false
policy_type: "evidential"

log_dir: "./logs/output_uncertainty"
checkpoint_dir: "./checkpoints/output_uncertainty"
