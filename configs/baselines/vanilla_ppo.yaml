# Baseline: Vanilla PPO
# 12-dim obs: EKF pose (6) + relative target (3) + obstacle features (3).
# No EKF covariance, no evidential actor. Pure PPO baseline.
#
# Ablation dimensions:
#   include_covariance: false  (no covariance dims)
#   include_obstacle_obs: true (obstacle dims present -- not the experimental variable)
#   policy_type: standard      (SB3 MlpPolicy + PPO)
#
# All other parameters inherited from configs/train_config.yaml.

baseline_name: "vanilla_ppo"
baseline_description: "Vanilla PPO with 12-dim obs (pose + target + obstacles), standard actor"

include_covariance: false
include_obstacle_obs: true
policy_type: "standard"

log_dir: "./logs/vanilla_ppo"
checkpoint_dir: "./checkpoints/vanilla_ppo"
