# CARLA Environment Configuration
# All settings that describe the simulation environment, sensors, and parking
# lot scenarios. Consumed by CARLAParkingEnv and related scripts.
# Training hyperparameters (PPO, evidential, architecture) live in train_config.yaml.

# Debug mode -- set true to emit per-step diagnostics and show a second HUD line
# in the visualiser. Off by default to avoid I/O overhead during training runs.
debug: false

# Inspection / dry-run settings (used by scripts/inspect/lot_inspector.py only,
# not consumed during training).
inspect:
  # Action applied every step in dryrun mode.
  # [steer, longitudinal] -- positive longitudinal = throttle, negative = brake.
  # 0.5 throttle is sufficient to overcome static friction on the FlatPlane world.
  dryrun_action: [0.0, 0.5]

# ---------------------------------------------------------------------------
# CARLA connection and simulation settings
# ---------------------------------------------------------------------------
carla_host: "uncertainty-rl-carla-0"  # Container name for worker 0 (resolved via shared bridge network). Use "localhost" for local dev.
carla_port: 2000
town: "FlatPlane"  # Loads configs/layouts/flat_plane.xodr via generate_opendrive_world(); clean flat ground with no buildings or traffic infrastructure
max_steps: 1000  # Episode length in agent decisions. With action_repeat=4, each decision spans 4 sim-steps (0.2s), so 1000 decisions = 4000 sim-steps = 200 seconds sim-time.
                 # Longer episodes amortise the fixed ~13s reset cost: 13s / (1000 * 0.2s + 13s) = 6% overhead vs 52% with max_steps=250.
                 # Lot diagonal ~79m (65x45m). At 6m/s cruise ~13s traversal +
                 # ~15-20s slow approach and parking manoeuvre = ~30s typical.
carla_timestep: 0.05  # Simulation timestep (seconds), 20 Hz. Fixed for EKF + ROS 2 bridge consistency.
map_load_sleep: 1.0  # Seconds to wait after loading flat_plane.xodr before continuing. Increase on slow servers.
no_rendering_mode: true  # Disable Unreal rendering pipeline (cameras return empty, physics + state work still active). Essential for state-based agents with no camera input. Speedup: 3-4x.
action_repeat: 4  # Apply same action for 4 sim-steps, construct observation only on 4th step. Agent decides at 5 Hz (fine for parking <6 m/s). Reduces observations and EKF covariance reads by 4x. Wall-clock speedup: 4x, episode length: same 50 seconds.
use_extra_spawns: false  # When false, only the primary spawn (0,0) is used. Ensures CARLA and Cartographer coordinate frames align (both start at origin). Set true once per-spawn pbstream maps or odom-to-world calibration are implemented.
max_ego_speed_ms: 6.0  # Maximum ego vehicle speed (m/s). Throttle is cut when exceeded to keep Cartographer scan-matching stable. 6 m/s (~22 km/h) is appropriate for a parking lot.

# ---------------------------------------------------------------------------
# ROS 2 covariance subscription settings
# The training container subscribes to real EKF covariance via DDS
# ---------------------------------------------------------------------------
ros2:
  covariance_topic: "/odometry/filtered"  # nav_msgs/Odometry from robot_localisation EKF
  covariance_timeout: 120.0  # Seconds to wait for first covariance message per episode (120s allows ros2-bridge to auto-restart on crash)
  # Total seconds to keep waiting for EKF velocity to drop below 0.5 m/s
  # (the convergence signal) before falling back to best available offset.
  # Cartographer pure localisation typically converges within 1-3 s after
  # /initialpose; 15 s covers slow scan-match cases (sparse lot, rain).
  ekf_convergence_timeout: 15.0
  publish_initial_pose: true     # Publish /initialpose at episode reset for Cartographer pure
                                 # localisation convergence. Safe in SLAM mode (Cartographer ignores it).
  initial_pose_topic: "/initialpose"

# ---------------------------------------------------------------------------
# CARLA sensor noise configuration
# Sensor suites (selected by sensor_suite key below):
#   suite_a: 2D LiDAR (front bumper) + IMU -- primary configuration
#   suite_b: 3D LiDAR (roof) + IMU -- upgrade if suite_a covariance variation insufficient
#   suite_c: 3D LiDAR (roof) + RGB camera (windscreen) + IMU -- visual odometry future work
#
# Mount positions are in vehicle body frame (BMW Grand Tourer):
#   x = longitudinal (positive = forward), y = lateral (positive = left), z = vertical
# ---------------------------------------------------------------------------
carla_sensors:
  imu:
    noise_accel_stddev_x: 0.1   # Accelerometer noise (m/s^2)
    noise_accel_stddev_y: 0.1
    noise_accel_stddev_z: 0.1
    noise_gyro_stddev_x: 0.01   # Gyroscope noise (rad/s)
    noise_gyro_stddev_y: 0.01
    noise_gyro_stddev_z: 0.01
    sensor_tick: 0.05           # Publish rate (seconds), matches carla_timestep
    mount:
      x: 0.0    # Centre of mass (longitudinal)
      y: 0.0
      z: 0.3    # Centre-of-mass height (metres)

  lidar:        # Suite A: 2D LiDAR (SICK TiM571)
    # Real spec: 1 channel, 270 deg, 25 m, 15 Hz, 0.33 deg angular resolution (~810 pts/scan).
    # Single channel at 0 deg vertical FOV = true horizontal scan plane.
    # Mount z=0.3 (vehicle frame) puts the scan plane at front bumper height,
    # intersecting the body of perimeter traffic cones (~0.7m tall).
    #
    # CARLA sim-to-real caveats (revert on real robot):
    #   - points_per_second: 2M (real TiM571: ~12,150 pts/sec). TiM571 beam
    #     divergence is ~1.26 deg; CARLA's zero-width rays need ~166x more
    #     density to compensate.
    #   - rotation_frequency: 20 Hz (real TiM571: 15 Hz). Matched to
    #     carla_timestep to avoid empty scan messages on tick boundaries.
    # On the real robot, revert to native specs.
    channels: 1                 # True 2D LiDAR: single horizontal scan plane
    range: 25.0                 # TiM571 max range (metres)
    points_per_second: 2000000  # CARLA workaround: compensates for zero beam divergence.
                                # 2M / 20 Hz = ~100k rays per scan -> ~0.004 deg angular step.
    rotation_frequency: 20.0    # Matched to carla_timestep (0.05s = 20 Hz) so each tick
                                # produces exactly one complete scan with no empty messages.
    upper_fov: 0.0              # Flat horizontal plane (2D LiDAR)
    lower_fov: 0.0              # Flat horizontal plane (2D LiDAR)
    sensor_tick: 0.05           # Matches carla_timestep (20 Hz)
    # @note CARLA sensor.lidar.ray_cast always scans 360 deg and does not collide
    # with the parent actor. Real TiM571 scans 270 deg (rear blocked by car body).
    # In CARLA, 360 deg is used consistently for both mapping and localisation.
    # On the real robot, the physical 270 deg FOV applies to both phases.
    mount:
      x: 2.4    # Front bumper centre (longitudinal)
      y: 0.0
      z: 0.5    # Above bumper lip; clears ego mesh so scan plane avoids self-returns

  lidar_3d:     # Suite B/C: 3D LiDAR (Velodyne VLP-16 Puck)
    # Real spec: 16 channels, 360 deg, 100 m, 5-20 Hz (typ 10), 300k pts/sec,
    # 0.2 deg horizontal resolution at 10 Hz, 2.0 deg vertical resolution.
    #
    # CARLA sim-to-real caveat: VLP-16 beam divergence is 0.17 deg horizontal.
    # CARLA's zero-width rays need ~7x more density to match. 300k * 7 = ~2M.
    # On the real robot, revert to native 300k pts/sec.
    channels: 16
    range: 100.0                # VLP-16 max range (metres)
    points_per_second: 2000000  # CARLA workaround: compensates for zero beam divergence.
                                # 2M / 10 Hz / 16 ch = ~12.5k rays per channel per revolution.
    rotation_frequency: 10.0    # VLP-16 typical rotation rate (Hz)
    upper_fov: 15.0             # +15 deg elevation (VLP-16 half-FOV)
    lower_fov: -15.0            # -15 deg elevation
    sensor_tick: 0.05
    mount:
      x: -0.5   # Roof mast, slightly behind centre (longitudinal)
      y: 0.0
      z: 1.9    # ~30 cm above roofline so downward beams clear the car body

  camera_rgb:   # Suite C: forward-facing RGB camera
    image_size_x: 640
    image_size_y: 480
    fov: 90.0                   # Horizontal field of view (degrees)
    sensor_tick: 0.05
    mount:
      x: 0.2    # Top of windshield (longitudinal)
      y: 0.0
      z: 1.4    # Top of windshield height (metres)
      pitch: -5.0               # Slight downward tilt for near-field coverage

# ---------------------------------------------------------------------------
# Parking lot scenario configuration
# Floor plan geometry is pre-computed offline (make generate-layouts) and
# stored in configs/layouts/. The env reads from these YAML files directly.
# ---------------------------------------------------------------------------
parking_scenarios:
  spawn_landmarks: true  # Spawn asymmetric jersey barriers along the perimeter to break lot symmetry for Cartographer scan matching. Set false to disable.
  landmark_blueprint: "static.prop.streetbarrier"  # CARLA blueprint for asymmetric landmarks. streetbarrier (~1.0m tall, 1.5m long) gives strong LiDAR returns.
  perimeter_marker_blueprint: "static.prop.constructioncone"
                                       # CARLA blueprint for perimeter/obstacle markers. Options:
                                       #   static.prop.constructioncone  - traffic cone (~0.7m, good LiDAR return)
                                       #   static.prop.trafficcone01     - smaller cone variant
                                       #   static.prop.streetbarrier     - jersey barrier (~1.0m, excellent return)
                                       #   static.prop.ironplank         - metal plank/rail
                                       # Run world.get_blueprint_library().filter('static.prop.*') in
                                       # CARLA to enumerate all available props for your map.
  perimeter_cone_spacing: 2.0          # Metres between perimeter markers
  bay_occupancy_min: 0.3               # Lower bound for per-episode bay occupancy (uniform resample)
  bay_occupancy_max: 0.8               # Upper bound for per-episode bay occupancy (uniform resample)
  num_patrol_vehicles_max: 1           # Exact NPC patrol vehicles spawned every episode (fixed, not randomised)
  patrol_obstacle_stop_distance: 6.0  # Metres - patrol brakes if any vehicle within range (omnidirectional for ego, + 1.0 m bumper buffer in code)
  patrol_pedestrian_stop_distance: 4.0  # Metres ahead - patrol brakes if any pedestrian within range
  patrol_max_speed_ms: 3.0            # Patrol vehicle speed in m/s (applied directly via kinematic, no physics acceleration)
  patrol_heading_gain: 0.8            # Proportional gain for patrol NPC heading controller
  patrol_stuck_speed_threshold: 0.3   # m/s below which NPC is considered stuck (while throttle applied)
  patrol_stuck_steps_max: 30          # Steps below threshold before teleporting NPC to next waypoint
  pedestrian_speed_ms: 1.4            # Pedestrian walk speed in m/s (applied directly via WalkerControl)
  pedestrian_spawn_probability: 0.8    # Per-zone independent spawn probability each episode (0.0-1.0)
  pedestrian_heading_resample_steps: 30  # Steps between pedestrian direction changes
  pedestrian_max_lifetime_steps: 200  # Steps before a pedestrian despawns and respawns in its zone
  floor_plans:
    rectangle:
      layout_file: configs/layouts/rectangle.yaml
      ood: false   # Used during training
    trapezoid:
      layout_file: configs/layouts/trapezoid.yaml
      ood: true    # Never sampled during training; held out for OOD evaluation
    irregular_a:
      layout_file: configs/layouts/irregular_a.yaml
      ood: true    # Never sampled during training; held out for OOD evaluation

# ---------------------------------------------------------------------------
# Sensor suite and observation flags
# ---------------------------------------------------------------------------
# Sensor suite selection - controls which sensors are spawned in _spawn_sensors()
# suite_a: 2D LiDAR + IMU (primary)
# suite_b: 3D LiDAR + IMU (upgrade if Suite A covariance variation is insufficient)
# suite_c: 3D LiDAR + camera + IMU (last resort, adds visual odometry)
sensor_suite: suite_a

# Observation space flags
# include_covariance: when true, EKF covariance features (indices 6-14) are included
# include_obstacle_obs: when true, 2 obstacle awareness dims are appended (20-dim total)
#   Set include_obstacle_obs: false to revert to 18-dim obs with no other changes.
#   obstacle_type removed: relied on privileged CARLA actor list, not available on real robot.
include_covariance: true
include_obstacle_obs: true  # Adds nearest_dist_m, nearest_bearing_rad
