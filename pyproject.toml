[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uncertainty-rl"
version = "0.1.0"
description = "Uncertainty-Conditioned RL with Evidential Policy Networks for Autonomous Systems"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Antonio Galdes"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "gymnasium>=0.29.0",
    "stable-baselines3>=2.0.0",
    "pyyaml>=6.0",
    "tensorboard>=2.13.0",
    "matplotlib>=3.7.0",
    "pygame>=2.5.0",
    "seaborn>=0.12.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=24.0",
    "isort>=5.13",
    "flake8>=7.0",
    "mypy>=1.8.0",
    "types-PyYAML>=6.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
uncertainty-rl-train = "uncertainty_rl.training.train_ppo:main"
uncertainty-rl-eval = "uncertainty_rl.evaluation.evaluate:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["uncertainty_rl*"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
known_first_party = ["uncertainty_rl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring CARLA or ROS 2",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
