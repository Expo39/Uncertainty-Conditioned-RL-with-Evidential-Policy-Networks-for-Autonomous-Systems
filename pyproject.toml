[build-system]
# Pinned for reproducible builds across machines. Versions captured from the
# working training image (NGC PyTorch 24.10 base).
requires = ["setuptools==82.0.1", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uncertainty-rl"
version = "0.1.0"
description = "Uncertainty-Conditioned RL with Evidential Policy Networks for Autonomous Systems"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Antonio Galdes"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    # Host-installable deps (no torch/CUDA).  Layout tools, visualiser, type stubs.
    # Pinned to exact versions for reproducible builds across machines; values
    # captured from the working training image (NGC PyTorch 24.10 base).
    "pyyaml==6.0.2",
    "matplotlib==3.9.2",
    "pygame==2.6.1",
    "seaborn==0.13.2",
    "pandas==2.2.2",
    "numpy==1.24.4",
]

[project.optional-dependencies]
# Training deps - installed only inside the Docker training container via
# pip install -e ".[training]". 
# torch/sb3/gymnasium pull in CUDA and must never run through make install.
training = [
    # Pinned to exact versions for reproducible builds (working training image).
    "gymnasium==1.2.3",
    "stable-baselines3==2.8.0",
    "tensorboard==2.16.2",
    "optuna==4.9.0",
    "ruamel.yaml==0.19.1",
]
dev = [
    # Pinned to exact versions for reproducible builds (working training image).
    "pytest==8.1.1",
    "pytest-cov==7.1.0",
    "black==24.8.0",
    "isort==5.13.2",
    "flake8==7.3.0",
    "mypy==2.1.0",
    "types-PyYAML==6.0.12.20260518",
    "pre-commit==4.6.0",
]

[project.scripts]
uncertainty-rl-train = "uncertainty_rl.training.train_ppo:main"
uncertainty-rl-eval = "uncertainty_rl.evaluation.evaluate:main"
uncertainty-rl-tune = "uncertainty_rl.training.tune_hyperparams:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["uncertainty_rl*"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
known_first_party = ["uncertainty_rl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring CARLA or ROS 2",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
