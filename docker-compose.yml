
# @file docker-compose.yml
# @brief Docker Compose orchestration for uncertainty-conditioned RL research stack.

# This compose file orchestrates:
# - CARLA Server (headless simulation)
# - ROS 2 Jazzy + CARLA bridge + robot_localisation
# - Training/evaluation container with PyTorch + SB3 + evidential networks

# Network architecture: Internal bridge network for container communication.
# Volume mounts: Persistent storage for logs, checkpoints, configs.

# @author Antonio Galdes

services:
  # CARLA simulation server - headless with GPU passthrough
  carla-server:
    image: carlasim/carla:0.9.16
    container_name: uncertainty-rl-carla
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - DISPLAY=${DISPLAY}
    # Headless mode: -RenderOffScreen for no display requirement
    command: /bin/bash CarlaUE4.sh -RenderOffScreen -world-port=2000 -resx=800 -resy=600 -quality-level=Low
    ports:
      - "2000-2002:2000-2002"  # CARLA world, streaming, RPC
    networks:
      - uncertainty-rl-network
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Mount host Vulkan ICD so CARLA can find the NVIDIA Vulkan driver inside the container
      - /usr/share/vulkan/icd.d:/usr/share/vulkan/icd.d:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/2000' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ROS 2 Jazzy bridge with robot_localisation EKF
  ros2-bridge:
    build:
      context: .
      dockerfile: uncertainty_rl/ros2/Dockerfile
      args:
        ROS_DISTRO: jazzy
    container_name: uncertainty-rl-ros2
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - ROS_DOMAIN_ID=42
      - CARLA_HOST=carla-server
      - CARLA_PORT=2000
      # Selects Cartographer config: suite_a (default), suite_b, or suite_c.
      # suite_a: cartographer_config.lua (LaserScan, 270 deg filtered)
      # suite_b/c: cartographer_config_3d.lua (PointCloud2, 16-channel 3D LiDAR)
      - SENSOR_SUITE=${SENSOR_SUITE:-suite_a}
    depends_on:
      carla-server:
        condition: service_healthy
    networks:
      - uncertainty-rl-network
    volumes:
      - ./configs:/workspace/configs:ro
      - ./logs/ros2:/workspace/logs:rw
      - ./uncertainty_rl/ros2:/workspace/ros2_nodes:ro
    command: >
      bash -c "
        source /opt/ros/jazzy/setup.bash &&
        source /workspace/install/setup.bash &&
        ros2 launch uncertainty_rl_ros2 carla_bridge.launch.py
      "
    healthcheck:
      test: ["CMD-SHELL", "source /opt/ros/jazzy/setup.bash && source /workspace/install/setup.bash && ros2 topic list | grep -q /ekf_uncertainty/covariance || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      # Allow 60s for CARLA bridge + EKF + covariance extractor to fully initialise
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Training and evaluation container
  training:
    build:
      context: .
      dockerfile: uncertainty_rl/training/Dockerfile
      args:
        PYTORCH_VERSION: 24.10-py3
    container_name: uncertainty-rl-training
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - ROS_DOMAIN_ID=42
      - PYTHONUNBUFFERED=1
      - CARLA_HOST=carla-server
      - CARLA_PORT=2000
    depends_on:
      carla-server:
        condition: service_healthy
      ros2-bridge:
        condition: service_started
    networks:
      - uncertainty-rl-network
    volumes:
      - ./uncertainty_rl:/workspace/uncertainty_rl:ro
      - ./configs:/workspace/configs:ro
      - ./scripts:/workspace/scripts:ro
      - ./logs:/workspace/logs:rw
      - ./checkpoints:/workspace/checkpoints:rw
      - ./tests:/workspace/tests:ro
    working_dir: /workspace
    command: /bin/bash
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # TensorBoard for monitoring training metrics (optional)
  tensorboard:
    image: python:3.10-slim
    container_name: uncertainty-rl-tensorboard
    ports:
      - "6006:6006"
    networks:
      - uncertainty-rl-network
    volumes:
      - ./logs:/logs:ro
    entrypoint: >
      bash -c "pip install --no-cache-dir tensorboard && tensorboard --logdir=/logs --host=0.0.0.0 --port=6006"

  ###############################################################################
  # Additional services for demo and inspection - not part of core training stack                       
  ###############################################################################


  # CARLA demo server - windowed (no -RenderOffScreen), separate port range
  # Requires X11 forwarding on host (DISPLAY env var must be set).
  # Start with: make docker-demo MODEL=checkpoints/final_model
  carla-server-demo:
    image: carlasim/carla:0.9.16
    container_name: uncertainty-rl-carla-demo
    runtime: nvidia
    profiles:
      - demo
      - inspect
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - DISPLAY=${DISPLAY}
      - XDG_RUNTIME_DIR=/tmp/runtime-root
    # Windowed mode: -RenderOffScreen is intentionally omitted so CARLA renders to the host X11 display.
    command: >
      /bin/bash -c "mkdir -p /tmp/runtime-root && chmod 700 /tmp/runtime-root
      && /bin/bash CarlaUE4.sh -windowed -world-port=2100 -resx=800 -resy=600 -quality-level=Low"
    ports:
      - "2100-2102:2100-2102"
    networks:
      - uncertainty-rl-network
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /usr/share/vulkan/icd.d:/usr/share/vulkan/icd.d:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/2100' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Demo evaluation container - loads checkpoint and runs evaluation against windowed CARLA
  training-demo:
    build:
      context: .
      dockerfile: uncertainty_rl/training/Dockerfile
      args:
        PYTORCH_VERSION: 24.10-py3
    container_name: uncertainty-rl-training-demo
    runtime: nvidia
    profiles:
      - demo
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - ROS_DOMAIN_ID=42
      - PYTHONUNBUFFERED=1
      - CARLA_HOST=carla-server-demo
      - CARLA_PORT=2100
    depends_on:
      carla-server-demo:
        condition: service_healthy
    networks:
      - uncertainty-rl-network
    volumes:
      - ./uncertainty_rl:/workspace/uncertainty_rl:ro
      - ./configs:/workspace/configs:ro
      - ./scripts:/workspace/scripts:ro
      - ./logs:/workspace/logs:rw
      - ./checkpoints:/workspace/checkpoints:rw
      - ./tests:/workspace/tests:ro
    working_dir: /workspace
    command: >
      python uncertainty_rl/evaluation/evaluate.py
      --model-path ${MODEL:-checkpoints/final_model}
      --eval-config configs/eval_config.yaml
      --train-config configs/train_config.yaml
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Inspect container - spawns a layout in windowed CARLA for visual inspection (no training).
  # Usage: make docker-inspect LAYOUT=trapezoid
  training-inspect:
    build:
      context: .
      dockerfile: uncertainty_rl/training/Dockerfile
      args:
        PYTORCH_VERSION: 24.10-py3
    container_name: uncertainty-rl-training-inspect
    runtime: nvidia
    profiles:
      - inspect
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/workspace
      - CARLA_HOST=carla-server-demo
      - CARLA_PORT=2100
    depends_on:
      carla-server-demo:
        condition: service_healthy
    networks:
      - uncertainty-rl-network
    volumes:
      - ./uncertainty_rl:/workspace/uncertainty_rl:ro
      - ./configs:/workspace/configs:ro
      - ./scripts:/workspace/scripts:ro
      - ./outputs:/workspace/outputs:rw
    working_dir: /workspace
    command: >
      python scripts/inspect/inspect_layout.py
      --layout ${LAYOUT:-trapezoid}
      --host carla-server-demo
      --port 2100
      --duration 300
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Sensor inspector container - draws sensor mount overlays in windowed CARLA.
  # Usage: make docker-inspect-sensors [INSPECT_SUITE=suite_a]
  training-inspect-sensors:
    build:
      context: .
      dockerfile: uncertainty_rl/training/Dockerfile
      args:
        PYTORCH_VERSION: 24.10-py3
    container_name: uncertainty-rl-training-inspect-sensors
    runtime: nvidia
    profiles:
      - inspect-sensors
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/workspace
      - CARLA_HOST=carla-server-demo
      - CARLA_PORT=2100
    depends_on:
      carla-server-demo:
        condition: service_healthy
    networks:
      - uncertainty-rl-network
    volumes:
      - ./uncertainty_rl:/workspace/uncertainty_rl:ro
      - ./configs:/workspace/configs:ro
      - ./scripts:/workspace/scripts:ro
      - ./outputs:/workspace/outputs:rw
    working_dir: /workspace
    command: >
      python scripts/inspect/inspect_sensors.py
      --suite ${SUITE:-suite_a}
      --host carla-server-demo
      --port 2100
      --duration 120
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

networks:
  uncertainty-rl-network:
    driver: bridge
    name: uncertainty-rl-network

volumes:
  logs:
  checkpoints:
