
# @file docker-compose.yml
# @brief Core training stack for uncertainty-conditioned RL research.
#
# Defines the training container, demo container, and TensorBoard.
# CARLA servers and ros2-bridge instances are managed separately via
# docker-compose.env_workers.yml. Start N env workers first, then start
# this stack -- always through Make targets, never docker compose directly.
#
# Visual inspection and demo services live in docker-compose.inspect.yml.
#
# @author Antonio Galdes

name: ucrl

services:
  # Training and evaluation container
  training:
    build:
      context: .
      dockerfile: uncertainty_rl/training/Dockerfile
      args:
        PYTORCH_VERSION: 24.10-py3
    container_name: uncertainty-rl-training
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - PYTHONUNBUFFERED=1
    networks:
      - uncertainty-rl-network
    volumes:
      - ./uncertainty_rl:/workspace/uncertainty_rl:ro
      - ./configs:/workspace/configs:ro
      - ./scripts:/workspace/scripts:ro
      - ./logs:/workspace/logs:rw
      - ./checkpoints:/workspace/checkpoints:rw
      - ./tests:/workspace/tests:ro
      - ./outputs:/workspace/outputs:rw
    working_dir: /workspace
    command: /bin/bash
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Demo / evaluation container -- same image as training but runs demo_drive.py.
  # Started on demand by make eval-visualise-2d; never started by make docker-up.
  # Separated from the training container so a live training run is never interrupted.
  demo:
    build:
      context: .
      dockerfile: uncertainty_rl/training/Dockerfile
      args:
        PYTORCH_VERSION: 24.10-py3
    container_name: uncertainty-rl-demo
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - PYTHONUNBUFFERED=1
      - CARLA_HOST=carla-server-0
      - CARLA_PORT=2000
      - CARTOGRAPHER_MODE=${CARTOGRAPHER_MODE:-loc}
      - CARTOGRAPHER_MAP=${CARTOGRAPHER_MAP:-}
      - SENSOR_SUITE=${SENSOR_SUITE:-suite_a}
    networks:
      - uncertainty-rl-network
    volumes:
      - ./uncertainty_rl:/workspace/uncertainty_rl:ro
      - ./configs:/workspace/configs:ro
      - ./scripts:/workspace/scripts:ro
      - ./checkpoints:/workspace/checkpoints:ro
      - ./outputs:/workspace/outputs:rw
    working_dir: /workspace
    profiles:
      - demo
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # TensorBoard for monitoring training metrics (optional)
  tensorboard:
    image: python:3.10-slim
    container_name: uncertainty-rl-tensorboard
    ports:
      - "6006:6006"
    networks:
      - uncertainty-rl-network
    volumes:
      - ./logs:/logs:ro
    entrypoint: >
      bash -c "pip install --no-cache-dir tensorboard && tensorboard --logdir=/logs --host=0.0.0.0 --port=6006"

networks:
  uncertainty-rl-network:
    driver: bridge
    name: uncertainty-rl-network
